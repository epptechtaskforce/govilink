<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GoviLink</title>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#0c2217">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* =====================================================================================
     GoviLink design system: calm, precise, data-first (enterprise software, not a toy).
     Neutral surfaces with hairline borders, one deep green accent, line icons in one style.
     Colour carries meaning only: green = good / primary, amber = attention, red = danger, blue = information.
     The feature colour classes (.c-green .c-sky .c-sun .c-violet .c-aqua .c-slate .c-red) are kept because the
     scripts use them, but they only tint small icon squares and badges.
     ===================================================================================== */
  :root {
    --bg:#f6f7f9; --surface:#ffffff; --ink:#101828; --muted:#667085; --faint:#98a2b3;
    --line:#e4e7ec; --line-strong:#d0d5dd; --soft:#f9fafb;
    --brand:#0f6b4a; --brand-600:#0c5a3e; --brand-700:#094d35; --brand-50:#e7f3ee; --brand-100:#cfe7dd;
    --deep:#0e1a16; --deep-2:#14231e;
    --sun:#b54708; --sun-50:#fffaeb; --sky:#175cd3; --sky-50:#eff4ff; --aqua:#0f766e; --aqua-50:#f0fdfa;
    --violet:#6941c6; --violet-50:#f4f3ff; --red:#d92d20; --red-50:#fef3f2; --slate:#475467; --slate-50:#f2f4f7;
    --accent:#b54708; --accent-50:#fffaeb; --amber:#fffaeb; --blue:#175cd3; --blue-50:#eff4ff; --ok:#067647; --ok-50:#ecfdf3;
    --radius:12px; --radius-sm:8px; --radius-xs:6px;
    --shadow-sm:0 1px 2px rgba(16,24,40,.06);
    --shadow-md:0 8px 24px rgba(16,24,40,.12), 0 2px 6px rgba(16,24,40,.06);
    --font:'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    --focus:0 0 0 3px rgba(15,107,74,.22);
    --touch:44px;
  }
  * { box-sizing: border-box; }
  html, body { height:100%; }
  body { margin:0; font-family:var(--font); font-size:14px; line-height:1.45; color:var(--ink); background:var(--bg); -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent; }
  h1, h2, h3, p { margin:0; }
  button, input, select, textarea { font-family:inherit; font-size:inherit; color:inherit; }
  svg.ic { width:20px; height:20px; flex:none; fill:none; stroke:currentColor; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round; }
  a { color:var(--brand); }
  :focus-visible { outline:2px solid var(--brand); outline-offset:2px; }
  input:focus-visible, select:focus-visible, textarea:focus-visible { outline:none; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition:none !important; scroll-behavior:auto !important; } }

  /* icon colours: a very light tint and a deep tone of the same hue, never a gradient */
  .c-green { --c:#0f6b4a; --c2:#094d35; --t:#e7f3ee; }
  .c-sky { --c:#175cd3; --c2:#1849a9; --t:#eff4ff; }
  .c-sun { --c:#b54708; --c2:#93370d; --t:#fffaeb; }
  .c-violet { --c:#6941c6; --c2:#53389e; --t:#f4f3ff; }
  .c-aqua { --c:#0f766e; --c2:#115e59; --t:#f0fdfa; }
  .c-slate { --c:#475467; --c2:#344054; --t:#f2f4f7; }
  .c-red { --c:#d92d20; --c2:#b42318; --t:#fef3f2; }

  /* icon square: a light tint with a line icon in the deep tone */
  .ico { display:grid; place-items:center; width:40px; height:40px; flex:none; border-radius:10px; color:var(--c,#0f6b4a); background:var(--t,#e7f3ee); }
  .ico svg { width:20px; height:20px; stroke:var(--c,#0f6b4a); }
  .ico.sm { width:32px; height:32px; border-radius:8px; } .ico.sm svg { width:18px; height:18px; }
  .ico.lg { width:48px; height:48px; border-radius:12px; } .ico.lg svg { width:24px; height:24px; }
  .ico.soft { background:var(--t,#e7f3ee); }

  /* ---------- application shell ---------- */
  .app { display:grid; grid-template-columns:84px minmax(0,1fr); min-height:100vh; }
  body.auth .app { display:none; }
  body:not(.auth) #loginview { display:none; }
  #rail { position:sticky; top:0; height:100vh; background:var(--deep); color:#9fb3a9; display:flex; flex-direction:column; align-items:center; padding:14px 8px; z-index:30; }
  .logo { width:40px; height:40px; border-radius:10px; background:#17835b; display:grid; place-items:center; margin-bottom:18px; cursor:pointer; flex:none; }
  .logo svg { width:22px; height:22px; fill:none; stroke:#fff; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round; }
  #nav { flex:1; width:100%; display:flex; flex-direction:column; gap:2px; overflow:auto; scrollbar-width:none; }
  #nav::-webkit-scrollbar { display:none; }
  .navbtn { position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; padding:10px 2px 9px; border:0; border-radius:8px; background:transparent; color:#9fb3a9; cursor:pointer; font-weight:500; font-size:11px; line-height:1.1; width:100%; transition:background .12s, color .12s; }
  .navbtn svg { width:20px; height:20px; }
  .navbtn:hover { background:rgba(255,255,255,.06); color:#fff; }
  .navbtn.on { background:rgba(255,255,255,.09); color:#fff; font-weight:600; }
  .navbtn.on::before { content:''; position:absolute; left:-8px; top:9px; bottom:9px; width:3px; border-radius:0 3px 3px 0; background:#4ade80; }
  .railfoot { margin-top:8px; flex:none; position:relative; }
  .main-wrap { min-width:0; display:flex; flex-direction:column; min-height:100vh; }
  .topbar { position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:14px; padding:0 28px; min-height:56px; background:#fff; border-bottom:1px solid var(--line); }
  .pagehead { display:flex; align-items:center; gap:10px; flex:1; min-width:0; }
  .pagehead h1 { font-size:17px; font-weight:600; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #pageico .ico { width:28px; height:28px; border-radius:7px; } #pageico .ico svg { width:16px; height:16px; }
  #backbtn { display:none; }
  .userbtn { display:flex; align-items:center; gap:9px; border:1px solid var(--line); background:#fff; border-radius:8px; padding:3px 10px 3px 3px; cursor:pointer; font-weight:600; transition:background .12s; }
  .userbtn:hover { background:var(--soft); }
  .avatar { width:30px; height:30px; border-radius:50%; background:var(--brand-50); color:var(--brand-700); font-weight:600; font-size:12px; display:grid; place-items:center; flex:none; letter-spacing:.02em; }
  .avatar.lg { width:56px; height:56px; font-size:20px; }
  .avatar.md { width:40px; height:40px; font-size:14px; }
  .userbtn .who1 { font-size:13px; line-height:1.15; text-align:left; } .userbtn .who2 { font-size:11.5px; color:var(--muted); font-weight:400; text-align:left; }
  .usermenu { position:absolute; right:24px; top:52px; width:260px; background:#fff; border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow-md); padding:6px; display:none; z-index:60; }
  .usermenu.open { display:block; }
  .usermenu .uhead { padding:10px 10px 12px; border-bottom:1px solid var(--line); margin-bottom:4px; }
  .usermenu .uhead b { display:block; font-size:14px; font-weight:600; } .usermenu .uhead span { color:var(--muted); font-size:12.5px; word-break:break-all; }
  .usermenu button { display:flex; align-items:center; gap:10px; width:100%; border:0; background:transparent; padding:8px 10px; border-radius:8px; cursor:pointer; text-align:left; font-weight:500; }
  .usermenu button:hover { background:var(--soft); }
  .rolechip { display:inline-block; margin-top:7px; padding:2px 10px; border-radius:999px; background:var(--brand-50); color:var(--brand-700); font-size:12px; font-weight:600; }
  main { flex:1; padding:24px 28px 60px; }
  #main { max-width:1240px; margin:0 auto; }
  .scrim { display:none; }
  /* the "more" sheet */
  #sheet { position:fixed; inset:0; z-index:90; display:none; background:rgba(16,24,40,.5); align-items:flex-end; justify-content:center; }
  #sheet.open { display:flex; }
  #sheet .panel { background:var(--bg); width:100%; max-width:640px; border-radius:16px 16px 0 0; padding:14px 16px 24px; max-height:86vh; overflow:auto; animation:rise .16s ease-out; }
  #sheet .grab { width:36px; height:4px; border-radius:2px; background:var(--line-strong); margin:0 auto 14px; }
  @keyframes rise { from { transform:translateY(24px); opacity:0; } to { transform:none; opacity:1; } }
  @media (min-width: 861px) { #sheet { align-items:center; } #sheet .panel { border-radius:14px; } }

  /* ---------- sign in ---------- */
  #loginview { min-height:100vh; display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,1fr); }
  .loginhero { position:relative; overflow:hidden; background:var(--deep); color:#fff; display:flex; flex-direction:column; justify-content:space-between; padding:40px 48px; }
  .loginhero .contours { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  .loginhero > * { position:relative; }
  .loginhero .contours { position:absolute; }
  .contours .cn { stroke:rgba(255,255,255,.055); stroke-width:1; } .contours .cm { stroke:rgba(255,255,255,.12); stroke-width:1; }
  .loginhero .brandrow { display:flex; align-items:center; gap:12px; }
  .loginhero .brandrow .ico { background:#17835b; width:40px; height:40px; } .loginhero .brandrow .ico svg { stroke:#fff; }
  .loginhero .brandrow b { font-size:19px; font-weight:600; color:#fff; letter-spacing:-.01em; }
  .loginhero .brandrow small { display:block; color:#7f9a8e; font-weight:500; letter-spacing:.12em; font-size:10.5px; }
  .loginhero .herobody { max-width:440px; }
  .loginhero .tagline { font-size:30px; line-height:1.18; font-weight:600; color:#fff; letter-spacing:-.02em; }
  .loginhero .caps { margin-top:28px; display:grid; gap:14px; }
  .loginhero .cap { display:flex; align-items:center; gap:12px; color:#c3d4cb; font-size:14px; }
  .loginhero .cap .ci { width:32px; height:32px; border-radius:8px; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.08); display:grid; place-items:center; flex:none; }
  .loginhero .cap .ci svg { width:17px; height:17px; stroke:#8fe0b4; }
  .loginhero .herofoot { color:#6f877b; font-size:12px; }
  .loginpane { display:grid; place-items:center; padding:36px 26px; background:#fff; }
  .loginbox { width:100%; max-width:380px; }
  .loginbox .hello { display:flex; margin-bottom:18px; }
  .loginbox h1 { font-size:24px; font-weight:600; letter-spacing:-.02em; }
  .loginbox .lead { color:var(--muted); margin:6px 0 24px; }
  .loginbox .btn-block { width:100%; margin-top:8px; }
  .loginbox .small { margin-top:20px; font-size:13px; color:var(--muted); }
  .inwrap { position:relative; margin-top:12px; }
  .inwrap > svg { position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--faint); width:18px; height:18px; pointer-events:none; }
  .inwrap input[type=text], .inwrap input[type=email], .inwrap input[type=password] { padding-left:38px; }

  /* ---------- page pieces ---------- */
  .card { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:20px; margin-bottom:16px; box-shadow:var(--shadow-sm); }
  .card h2 { font-size:15px; font-weight:600; letter-spacing:-.005em; margin:0 0 4px; }
  .card h3 { font-size:11.5px; margin:20px 0 8px; color:var(--muted); text-transform:uppercase; letter-spacing:.07em; font-weight:600; padding-top:14px; border-top:1px solid var(--line); }
  .card h2 + h3, .card h2 + .hint + h3 { border-top:0; padding-top:0; margin-top:14px; }
  .card.flush { padding:0; overflow:hidden; }
  .cardhead { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
  .cardhead h2 { margin:0; display:flex; align-items:center; gap:10px; }
  .cols { display:grid; grid-template-columns:minmax(280px,360px) minmax(0,1fr); gap:20px; align-items:start; }
  @media (max-width: 900px) { .cols { grid-template-columns:1fr; } }
  .hint { color:var(--muted); font-size:13px; margin:4px 0; }
  .pv { }
  .loading { display:flex; align-items:center; gap:10px; color:var(--muted); padding:40px 8px; justify-content:center; font-weight:500; animation:softin0 .2s ease-out .18s both; }
  .spinner { width:20px; height:20px; border-radius:50%; border:2.5px solid var(--brand-100); border-top-color:var(--brand); animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .empty { text-align:center; color:var(--muted); padding:28px 16px; }
  .empty .ico { width:48px; height:48px; border-radius:50%; margin:0 auto 12px; background:var(--slate-50); } .empty .ico svg { width:22px; height:22px; stroke:var(--slate); }
  .empty b { display:block; color:var(--ink); font-size:14px; margin-bottom:2px; font-weight:600; }

  /* messages pop up at the top (the bottom has the menu bar on phones) */
  #msg { position:fixed; top:16px; left:50%; transform:translateX(-50%); z-index:300; width:calc(100% - 28px); max-width:440px; display:none; align-items:center; gap:10px; padding:11px 12px 11px 14px; border-radius:10px; background:#101828; color:#fff; box-shadow:var(--shadow-md); font-weight:500; animation:slidein .18s ease-out; }
  #msg.ok, #msg.err { display:flex; }
  #msg.err { background:#b42318; }
  #msg .mi { width:24px; height:24px; border-radius:50%; background:rgba(255,255,255,.16); display:grid; place-items:center; flex:none; }
  #msg .mi svg { width:14px; height:14px; stroke:#fff; stroke-width:2.4; }
  #msg .txt { flex:1; word-break:break-word; }
  #msg .x { border:0; background:transparent; cursor:pointer; color:#fff; font-size:20px; line-height:1; padding:0 4px; opacity:.75; }
  @keyframes slidein { from { opacity:0; transform:translate(-50%,-10px); } to { opacity:1; transform:translate(-50%,0); } }

  /* ---------- forms ---------- */
  label.f { display:block; margin:14px 0 6px; font-weight:500; font-size:13px; color:#344054; }
  input[type=text], input[type=date], input[type=time], input[type=email], input[type=password], input[type=number], select, textarea {
    width:100%; padding:8px 12px; border:1px solid var(--line-strong); border-radius:8px; background:#fff; transition:border-color .12s, box-shadow .12s; min-height:38px; font-weight:400; box-shadow:var(--shadow-sm); }
  input::placeholder, textarea::placeholder { color:#98a2b3; font-weight:400; }
  input:focus, select:focus, textarea:focus { outline:none; border-color:var(--brand); box-shadow:var(--focus); }
  input:disabled, select:disabled { background:var(--soft); color:var(--faint); }
  select { appearance:none; -webkit-appearance:none; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2398a2b3' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>"); background-repeat:no-repeat; background-position:right 10px center; background-size:16px; padding-right:34px; }
  textarea { min-height:96px; resize:vertical; }
  input[type=checkbox], input[type=radio] { accent-color:var(--brand); width:16px; height:16px; vertical-align:-3px; margin-right:6px; }
  .checks label { display:inline-block; margin:8px 18px 0 0; font-weight:500; }
  .grid3 { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:0 16px; }
  @media (max-width: 900px) { .grid3 { grid-template-columns:1fr 1fr; } }
  @media (max-width: 600px) { .grid3 { grid-template-columns:1fr; } }
  .fld { min-width:0; }
  .fieldrow { border:1px solid var(--line); border-radius:var(--radius-sm); padding:14px 16px; margin-bottom:12px; background:var(--soft); }
  .fieldhead { display:flex; justify-content:space-between; align-items:center; margin-bottom:2px; }
  .stephead { display:flex; align-items:center; gap:12px; }
  .step { width:26px; height:26px; border-radius:50%; background:var(--brand-50); color:var(--brand-700); font-weight:600; font-size:12.5px; display:grid; place-items:center; flex:none; }
  .searchrow { display:flex; gap:10px; margin-bottom:14px; }
  .searchrow input { flex:1; }
  .searchbox { position:relative; flex:1; }
  .searchbox svg { position:absolute; left:13px; top:50%; transform:translateY(-50%); color:var(--faint); width:18px; height:18px; }
  .searchbox input { padding-left:40px; min-height:44px; font-size:15px; border-radius:10px; }
  .searchrow button.b { min-height:44px; }
  label.inl { display:inline-block; margin:6px 0 0; font-weight:500; font-size:12.5px; color:var(--muted); }
  .login { }

  /* ---------- buttons ---------- */
  button.b, .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; background:var(--brand); color:#fff; border:1px solid var(--brand); padding:0 16px; min-height:36px; border-radius:8px; cursor:pointer; font-weight:600; font-size:14px; box-shadow:var(--shadow-sm); transition:background .12s, border-color .12s; }
  button.b:hover { background:var(--brand-600); border-color:var(--brand-600); }
  button.b:disabled { background:#a6c6b8; border-color:#a6c6b8; box-shadow:none; cursor:default; }
  button.b.big { min-height:40px; font-size:14.5px; padding:0 20px; }
  button.b.danger { background:var(--red); border-color:var(--red); }
  button.b.danger:hover { background:#b42318; border-color:#b42318; }
  button.b.danger:disabled { background:#f1b4af; border-color:#f1b4af; }
  button.b.ghost { background:#fff; color:var(--ink); border-color:var(--line-strong); }
  button.b.ghost:hover { background:var(--soft); }
  button.b.ghost:disabled { background:#fff; color:var(--faint); border-color:var(--line); }
  button.b.sky { background:var(--sky); border-color:var(--sky); }
  button.b.violet { background:var(--violet); border-color:var(--violet); }
  button.b svg, button.s svg { width:18px; height:18px; }
  button.s { display:inline-flex; align-items:center; gap:6px; background:#fff; color:var(--ink); border:1px solid var(--line-strong); padding:0 12px; min-height:32px; border-radius:8px; cursor:pointer; font-size:13px; font-weight:500; box-shadow:var(--shadow-sm); transition:background .12s; }
  button.s:hover { background:var(--soft); }
  button.s:disabled { opacity:.5; cursor:default; }
  .round { width:34px; height:34px; padding:0; border-radius:8px; display:inline-grid; place-items:center; border:1px solid var(--line-strong); background:#fff; cursor:pointer; color:var(--ink); text-decoration:none; flex:none; box-shadow:var(--shadow-sm); }
  .round:hover { background:var(--soft); }
  a.round { color:var(--brand-700); }
  a.callbtn { display:inline-flex; align-items:center; gap:8px; text-decoration:none; font-weight:600; padding:0 14px; min-height:36px; border-radius:8px; color:var(--ink); background:#fff; border:1px solid var(--line-strong); box-shadow:var(--shadow-sm); }
  a.callbtn:hover { background:var(--soft); }
  a.callbtn svg { width:18px; height:18px; }
  a.callbtn.chat { background:var(--brand-50); color:var(--brand-700); border-color:var(--brand-100); }

  /* ---------- tables, tags, notices ---------- */
  .tablewrap { overflow-x:auto; border-radius:var(--radius-sm); background:#fff; border:1px solid var(--line); }
  .card .tablewrap { margin-top:8px; }
  table.grid { border-collapse:separate; border-spacing:0; width:100%; }
  table.grid th, table.grid td { text-align:left; padding:10px 14px; border-bottom:1px solid var(--line); white-space:nowrap; font-size:13.5px; }
  table.grid th { background:var(--soft); font-size:11.5px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; position:sticky; top:0; }
  table.grid tbody tr:hover td { background:var(--soft); }
  table.grid tbody tr:last-child td { border-bottom:0; }
  table.grid td.num { text-align:right; font-variant-numeric:tabular-nums; }
  tr.off td { opacity:.55; }
  .pill { display:inline-flex; align-items:center; gap:5px; padding:2px 10px; border-radius:999px; font-size:12px; font-weight:500; background:var(--slate-50); color:#344054; }
  .pill svg { width:13px; height:13px; }
  .pill.green { background:var(--ok-50); color:var(--ok); }
  .pill.red { background:var(--red-50); color:#b42318; }
  .pill.amber { background:var(--sun-50); color:#b54708; }
  .pill.blue { background:var(--sky-50); color:#175cd3; }
  .pill.violet { background:var(--violet-50); color:#5925dc; }
  .warn { background:var(--sun-50); border:1px solid #fedf89; border-radius:var(--radius-sm); padding:10px 14px; font-weight:500; color:#93370d; }
  .badge { display:inline-block; font-size:11px; background:var(--sun-50); color:#93370d; border-radius:999px; padding:1px 8px; margin-left:6px; font-weight:500; }

  /* stat cards: label on top, figure below, small icon in the corner */
  .stats { display:flex; gap:12px; flex-wrap:wrap; margin:10px 0; }
  .nums { display:grid; grid-template-columns:repeat(auto-fit, minmax(190px, 1fr)); gap:14px; margin-bottom:18px; }
  .num { display:flex; flex-direction:row-reverse; justify-content:space-between; align-items:flex-start; gap:12px; background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; box-shadow:var(--shadow-sm); }
  .num > div { display:flex; flex-direction:column-reverse; gap:6px; min-width:0; }

  /* ratings: a star and a number */

  /* log book timeline */

  /* ---------- smooth updates (the helpers are in Common.html: softFetch, softShow, slideTo, revealTop, setBusy; Nav.open in App.html) ---------- */
  /* The spinner appears only if the answer takes more than a moment, so a fast answer shows no flash. */
  /* Content that is being refreshed stays on screen, dimmed a little, with a thin progress line on top. */
  /* a box that is refreshed keeps the margins of its children inside, so its height is the same while it glides (and its neighbours do not jump) */
  .soft-box { display:flow-root; }
  .soft-busy { position:relative; }
  .soft-busy > * { opacity:.5; pointer-events:none; transition:opacity .18s ease; }
  .soft-busy::before { content:''; position:absolute; left:0; right:0; top:0; height:2px; z-index:3; background:linear-gradient(90deg, transparent, var(--brand) 50%, transparent) no-repeat; background-size:38% 100%; animation:softbar 1s ease-in-out infinite; }
  @keyframes softbar { from { background-position:-40% 0; } to { background-position:140% 0; } }
  .soft-glide { overflow:hidden; }
  .usermenu.open, #sheet.open { animation:softin0 .14s ease-out both; }
  .soft-in0 { animation:softin0 .2s ease-out both; }
  .soft-in1 { animation:softin1 .2s ease-out both; }
  @keyframes softin0 { from { opacity:0; } to { opacity:1; } }
  @keyframes softin1 { from { opacity:.5; } to { opacity:1; } }
  /* a new screen fades in while the old one fades out on top of it (opacity only: the map screen has fixed children) */
  #main.xf { position:relative; }
  /* the next screen is drawn invisibly on top while the old one stays (dimmed) until it has something to show */
  .scr-pend { position:absolute; left:0; right:0; top:0; opacity:0; pointer-events:none; }
  .scr-wait > * { opacity:.55; pointer-events:none; transition:opacity .18s ease; }
  #pbar { position:fixed; top:0; left:0; right:0; height:2px; z-index:250; pointer-events:none; opacity:0; transition:opacity .15s; }
  #pbar.on { opacity:1; }
  #pbar::before { content:''; display:block; height:100%; background:linear-gradient(90deg, transparent, var(--brand) 50%, transparent) no-repeat; background-size:35% 100%; animation:softbar 1s ease-in-out infinite; }
  .scr-in { animation:scrin .18s ease-out .05s both; }
  .scr-out { position:absolute; left:0; right:0; pointer-events:none; animation:scrout .12s ease-in both; }
  @keyframes scrin { from { opacity:0; } to { opacity:1; } }
  @keyframes scrout { from { opacity:1; } to { opacity:0; } }
  /* placeholders that hold the space of figures that are still loading */
  .skel { border-radius:var(--radius); border:1px solid var(--line); background:linear-gradient(90deg, #f3f5f8 25%, #eceff3 40%, #f3f5f8 55%); background-size:300% 100%; animation:shimmer 1.5s ease-in-out infinite; }
  @keyframes shimmer { from { background-position:100% 0; } to { background-position:0 0; } }
  .wz .wzn { transition:background .15s, border-color .15s, color .15s; }
  .wzline { transition:background .2s; }
  .wz { transition:color .15s; }
  /* a button that is working keeps its size: the text is hidden and a small spinner sits in the middle */
  button.busy { position:relative; cursor:progress; color:transparent !important; }
  button.busy::after { content:''; position:absolute; left:50%; top:50%; width:16px; height:16px; margin:-8px 0 0 -8px; border-radius:50%; border:2px solid rgba(255,255,255,.45); border-top-color:#fff; animation:spin .7s linear infinite; }
  button.b.ghost.busy::after, button.s.busy::after { border-color:var(--line-strong); border-top-color:var(--brand); }
  /* instant feedback on press, with no change of size */
  button, a.callbtn, a.round, .opt, .chip, .pickrow, .lt, .navbtn, .wz, summary { touch-action:manipulation; }
  button.b:active:not(:disabled) { background:var(--brand-700); border-color:var(--brand-700); }
  button.b.ghost:active:not(:disabled), button.s:active:not(:disabled), .round:active, a.callbtn:active, .chip:active:not(.on), .pickrow:active, .lt:active, .wz:active .wzn { background:var(--slate-50); }
  .opt:active:not(.on) { background:var(--brand-50); border-color:var(--brand); }
  .navbtn:active { background:rgba(255,255,255,.14); }
  details.fold > summary:active { background:var(--slate-50); }

.eg-results { display:none; position:absolute; left:0; right:0; top:calc(100% + 6px); background:#fff; border:1px solid var(--line, #e4e7ec); border-radius:10px; box-shadow:0 14px 36px rgba(16,24,40,.28); max-height:min(62vh, 470px); overflow:auto; padding:4px 6px 6px; z-index:8; }
.eg-sec { font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted, #667085); padding:9px 8px 4px; font-weight:600; }
.eg-none { padding:14px 10px; color:var(--muted, #667085); font-size:12.5px; text-align:center; }
.eg-res { display:grid; grid-template-columns:28px minmax(0,1fr) auto; align-items:center; gap:10px; width:100%; border:0; background:transparent; text-align:left; padding:6px 8px; border-radius:8px; cursor:pointer; color:inherit; min-height:0; box-shadow:none; }
.eg-res:hover, .eg-res.on { background:var(--brand-50, #e7f3ee); }
.eg-res .eg-ri { width:28px; height:28px; border-radius:8px; background:var(--soft, #f2f4f7); display:grid; place-items:center; color:var(--muted, #667085); }
.eg-res .eg-rt { min-width:0; }
.eg-res .eg-rt b { display:block; font-weight:600; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.eg-res .eg-rt small { display:block; color:var(--muted, #667085); font-size:11.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.eg-res .eg-rn { font-size:12px; color:var(--muted, #667085); font-variant-numeric:tabular-nums; }

/* the path bar: Sri Lanka > District > Division > Tank > Committee */
.eg-path { display:flex; flex-wrap:wrap; align-items:center; gap:1px; max-width:100%; padding:3px; background:rgba(255,255,255,.94); border:1px solid var(--line, #e4e7ec); border-radius:10px; box-shadow:0 2px 12px rgba(16,24,40,.22); overflow-x:auto; scrollbar-width:none; }
.eg-path::-webkit-scrollbar { display:none; }
.eg-home, .eg-pk { flex:none; display:inline-flex; align-items:stretch; height:30px; border-radius:7px; font-size:12.5px; font-weight:600; color:var(--ink, #101828); }
.eg-home { align-items:center; gap:6px; padding:0 10px 0 8px; border:0; background:transparent; cursor:pointer; min-height:0; box-shadow:none; white-space:nowrap; }
.eg-home svg.ic { color:var(--muted, #667085); }
.eg-home:hover { background:var(--soft, #f2f4f7); }
.eg-home.on { background:var(--brand-50, #e7f3ee); color:var(--brand-700, #0b5c45); }
.eg-home.on svg.ic { color:var(--brand-700, #0b5c45); }
.eg-sep { flex:none; display:inline-flex; color:var(--faint, #98a2b3); }
.eg-sep svg.ic { width:12px; height:12px; }
.eg-pk { border:1px solid transparent; transition:background .15s, box-shadow .15s; }
.eg-pkb { display:inline-flex; align-items:center; gap:6px; height:100%; padding:0 8px 0 10px; border:0; background:transparent; color:inherit; font:inherit; cursor:pointer; min-height:0; box-shadow:none; border-radius:6px; white-space:nowrap; }
.eg-pkb:disabled { cursor:default; }
.eg-pk-l { max-width:130px; overflow:hidden; text-overflow:ellipsis; }
.eg-pkb small { font-size:11px; font-weight:500; color:var(--faint, #98a2b3); font-variant-numeric:tabular-nums; }
.eg-caret { display:inline-flex; }
.eg-caret svg.ic { width:12px; height:12px; transform:rotate(90deg); color:var(--faint, #98a2b3); }
.eg-pk:hover { background:var(--soft, #f2f4f7); }
.eg-pk.none { opacity:.5; }
.eg-pk.none:hover { background:transparent; }
.eg-pk.next { background:var(--brand-50, #e7f3ee); border-color:var(--brand-100, #cdeed9); color:var(--brand-700, #0b5c45); }
.eg-pk.next small, .eg-pk.next .eg-caret svg.ic { color:var(--brand-700, #0b5c45); }
.eg-pk.on { background:var(--brand, #0f6b4a); color:#fff; }
.eg-pk.on .eg-caret svg.ic { color:rgba(255,255,255,.8); }
.eg-pk.open { box-shadow:0 0 0 2px var(--brand, #0f6b4a); }
.eg-pkx { width:26px; border:0; border-left:1px solid rgba(255,255,255,.28); background:transparent; color:rgba(255,255,255,.88); display:grid; place-items:center; cursor:pointer; padding:0; min-height:0; box-shadow:none; border-radius:0 6px 6px 0; }
.eg-pkx:hover { background:rgba(255,255,255,.18); color:#fff; }
.eg-pkx svg.ic { width:13px; height:13px; }
.eg-hint { display:none; align-items:center; gap:7px; max-width:100%; height:28px; padding:0 11px; background:rgba(255,255,255,.88); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); border:1px solid rgba(255,255,255,.6); border-radius:8px; font-size:12px; color:#344054; box-shadow:0 1px 6px rgba(16,24,40,.2); }
.eg-hint svg.ic { width:14px; height:14px; color:var(--brand-700, #0b5c45); }
.eg-hint span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

/* the list under a path button */
.eg-menu { display:none; position:absolute; left:0; width:min(340px, calc(100vw - 28px)); z-index:8; background:#fff; border:1px solid var(--line, #e4e7ec); border-radius:10px; box-shadow:0 14px 36px rgba(16,24,40,.3); overflow:hidden; }
.eg-mh { padding:10px 14px 6px; }
.eg-mh b { display:block; font-size:13px; font-weight:600; }
.eg-mh small { display:block; font-size:11.5px; color:var(--muted, #667085); }
.eg-mf { display:flex; align-items:center; gap:8px; margin:2px 10px 4px; padding:0 10px; height:34px; border:1px solid var(--line-strong, #d0d5dd); border-radius:8px; color:var(--muted, #667085); }
.eg .eg-mf input[type=text] { flex:1; min-width:0; height:100%; border:0 !important; outline:0; background:transparent !important; box-shadow:none !important; padding:0 !important; margin:0; font:inherit; font-size:13px; color:var(--ink, #101828); min-height:0 !important; border-radius:0; }
.eg-mf:focus-within { border-color:var(--brand, #0f6b4a); }
.eg-ml { max-height:min(50vh, 340px); overflow:auto; padding:2px 6px 8px; }
.eg-li { display:grid; grid-template-columns:minmax(0,1fr) auto; column-gap:8px; align-items:center; text-align:left; border:0; background:transparent; padding:7px 8px 9px; border-radius:8px; cursor:pointer; min-height:0; color:inherit; box-shadow:none; width:100%; }
.eg-li:hover { background:var(--soft, #f2f4f7); }
.eg-li.on { background:var(--brand-50, #e7f3ee); }
.eg-li .eg-lm { min-width:0; }
.eg-li .eg-lm b { display:block; font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.eg-li .eg-lm small { display:block; font-size:11px; color:var(--muted, #667085); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.eg-li .eg-lv { font-size:13px; font-weight:600; font-variant-numeric:tabular-nums; }
.eg-li .eg-lb { grid-column:1 / -1; height:3px; border-radius:2px; background:var(--line, #e4e7ec); margin-top:6px; overflow:hidden; }
.eg-li .eg-lb i { display:block; height:100%; background:var(--brand, #0f6b4a); border-radius:2px; }

/* left edge: tools (icons only; the name shows when the pointer rests on one) */
.eg-tools { position:absolute; left:14px; top:130px; z-index:5; display:flex; flex-direction:column; background:rgba(255,255,255,.94); border:1px solid var(--line, #e4e7ec); border-radius:10px; box-shadow:0 2px 12px rgba(16,24,40,.22); }
.eg-tool { position:relative; display:grid; place-items:center; width:36px; height:36px; padding:0; border:0; border-top:1px solid var(--line, #e4e7ec); background:transparent; color:var(--muted, #667085); cursor:pointer; border-radius:0; min-height:0; box-shadow:none; }
.eg-tool:first-child { border-top:0; border-radius:9px 9px 0 0; }
.eg-tool:last-child { border-radius:0 0 9px 9px; }
.eg-tools.compact .eg-tool { height:30px; }
.eg-tool:hover { background:var(--soft, #f2f4f7); color:var(--ink, #101828); }
.eg-tool.on { background:var(--brand-50, #e7f3ee); color:var(--brand-700, #0b5c45); }
.eg-tool[data-tip]:hover::after { content:attr(data-tip); position:absolute; left:calc(100% + 8px); top:50%; transform:translateY(-50%); background:rgba(16,24,40,.95); color:#fff; font-size:11.5px; font-weight:500; padding:4px 9px; border-radius:6px; white-space:nowrap; pointer-events:none; z-index:9; }

/* bottom right: zoom */
.eg-zoom { position:absolute; right:14px; bottom:46px; z-index:5; display:flex; flex-direction:column; background:rgba(255,255,255,.94); border:1px solid var(--line, #e4e7ec); border-radius:10px; box-shadow:0 2px 12px rgba(16,24,40,.22); overflow:hidden; }
.eg-zoom button { width:36px; height:34px; border:0; background:transparent; display:grid; place-items:center; cursor:pointer; color:var(--ink, #101828); padding:0; min-height:0; border-radius:0; box-shadow:none; }
.eg-zoom button + button { border-top:1px solid var(--line, #e4e7ec); }
.eg-zoom button:hover { background:var(--soft, #f2f4f7); }

/* bottom left: colour scale */
.eg-scale { position:absolute; left:14px; bottom:34px; z-index:4; width:176px; background:rgba(255,255,255,.88); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,.6); border-radius:10px; padding:7px 10px 8px; box-shadow:0 2px 10px rgba(16,24,40,.22); }
.eg-sc-t { font-size:11px; font-weight:600; margin-bottom:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.eg-sc-bar { height:8px; border-radius:4px; }
.eg-sc-l { display:flex; justify-content:space-between; font-size:11px; color:#475467; margin-top:3px; font-variant-numeric:tabular-nums; }
.eg-sc-n { display:flex; align-items:center; gap:6px; margin-top:5px; font-size:11px; color:#475467; }
.eg-sc-n i { width:14px; height:8px; border-radius:2px; background:#8795a1; opacity:.5; display:block; }

/* top right: the legend. Small and see-through, it always shows the place the map is focused on. */
.eg-lg { position:absolute; right:14px; top:14px; z-index:5; width:282px; max-height:calc(100% - 28px); display:flex; flex-direction:column; background:rgba(255,255,255,.80); -webkit-backdrop-filter:blur(10px) saturate(1.1); backdrop-filter:blur(10px) saturate(1.1); border:1px solid rgba(255,255,255,.65); border-radius:12px; box-shadow:0 6px 22px rgba(16,24,40,.32); overflow:hidden; transition:background .2s; }
.eg-lg:hover { background:rgba(255,255,255,.93); }
.eg-lg.shut { width:auto; min-width:230px; max-width:calc(100% - 28px); }
.eg-ch { display:flex; align-items:center; gap:8px; padding:10px 8px 8px 12px; }
.eg-lg.shut .eg-ch { flex-wrap:wrap; row-gap:2px; }
.eg-ch .eg-ct { flex:1; min-width:0; }
.eg-ch .eg-ct b { display:block; font-size:14.5px; font-weight:600; line-height:1.25; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.eg-ch .eg-ct small { display:block; font-size:11px; color:#475467; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.eg-ch .eg-cs { display:none; order:3; flex-basis:100%; font-size:12px; color:#475467; font-variant-numeric:tabular-nums; }
.eg-lg.shut .eg-cs { display:block; }
.eg-ch .eg-cs b { color:var(--ink, #101828); font-weight:600; }
.eg-up, .eg-fold { width:28px; height:28px; border:1px solid rgba(16,24,40,.12); background:rgba(255,255,255,.75); border-radius:8px; display:grid; place-items:center; cursor:pointer; padding:0; min-height:0; color:#475467; box-shadow:none; flex:none; }
.eg-up:hover, .eg-fold:hover { background:#fff; color:var(--ink, #101828); }
.eg-quick { background:var(--brand, #0f6b4a); border-color:var(--brand, #0f6b4a); color:#fff; }
.eg-quick:hover { background:var(--brand-700, #0b5c45); color:#fff; }
.eg-lb2 { flex:1 1 auto; min-height:0; overflow:auto; padding:0 12px 12px; display:flex; flex-direction:column; gap:8px; }
.eg-lg.shut .eg-lb2 { display:none; }
.eg-row { display:flex; align-items:center; gap:8px; color:#475467; }
.eg .eg-row select { flex:1; min-width:0; height:30px; border:1px solid rgba(16,24,40,.16); border-radius:8px; padding:0 8px; background:rgba(255,255,255,.85); font:inherit; font-size:12.5px; font-weight:600; color:var(--ink, #101828); min-height:0; width:auto; box-shadow:none; }
.eg-dates { display:none; gap:6px; align-items:center; }
.eg-dates span { color:#475467; font-size:12px; }
.eg .eg-dates input[type=date] { flex:1; min-width:0; height:30px; padding:0 4px; border:1px solid rgba(16,24,40,.16); border-radius:8px; font:inherit; font-size:11.5px; min-height:0; width:auto; box-shadow:none; background:rgba(255,255,255,.85); }
.eg-go { height:30px; padding:0 12px; border:0; background:var(--brand, #0f6b4a); color:#fff; border-radius:8px; font-weight:600; font-size:12.5px; cursor:pointer; min-height:0; box-shadow:none; }
.eg-go:hover { background:var(--brand-700, #0b5c45); }
.eg-lg-note { font-size:10.5px; line-height:1.35; color:#475467; }
.eg-grid { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:6px; }
.eg-tile { display:flex; flex-direction:column; align-items:flex-start; gap:1px; min-width:0; min-height:56px; padding:6px 7px; border:1px solid rgba(16,24,40,.10); border-radius:9px; background:rgba(255,255,255,.66); text-align:left; cursor:pointer; color:var(--ink, #101828); box-shadow:none; transition:background .15s, border-color .15s, box-shadow .15s; }
.eg-tile:hover { background:rgba(255,255,255,.95); }
.eg-tile.on { background:rgba(231,243,238,.92); border-color:var(--brand, #0f6b4a); box-shadow:0 0 0 1px var(--brand, #0f6b4a); }
.eg-tile > span { max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.eg-tlab { font-size:10px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:#475467; }
.eg-tile.on .eg-tlab { color:var(--brand-700, #0b5c45); }
.eg-tv { font-size:17px; font-weight:600; line-height:1.2; font-variant-numeric:tabular-nums; }
.eg-ts { font-size:10px; color:#475467; font-variant-numeric:tabular-nums; }
.eg-trendcell { cursor:default; }
.eg-trendcell:hover { background:rgba(255,255,255,.66); }
.eg-tr-cols { display:flex; align-items:flex-end; gap:2px; height:20px; width:100%; margin:2px 0 1px; }
.eg-tr-c { flex:1 1 0; min-width:0; height:100%; display:flex; align-items:flex-end; border:0; background:transparent; padding:0; cursor:pointer; min-height:0; box-shadow:none; border-radius:0; }
.eg-tr-c i { display:block; width:100%; background:#8fd3b3; border-radius:2px 2px 0 0; transition:height .3s ease, background .12s; }
.eg-tr-c.now i { background:var(--brand, #0f6b4a); }
.eg-tr-c:hover i { background:var(--brand-600, #0d7a54); }
.eg-foot { display:flex; flex-direction:column; gap:6px; }
.eg-acts { display:flex; gap:6px; align-items:center; }
.eg-primary { flex:1; min-width:0; height:36px; border:0; background:var(--brand, #0f6b4a); color:#fff; border-radius:9px; font-weight:600; font-size:12.5px; display:flex; align-items:center; justify-content:center; gap:6px; cursor:pointer; min-height:0; box-shadow:none; padding:0 8px; }
.eg-primary span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.eg-primary:hover { background:var(--brand-700, #0b5c45); }
.eg-primary:disabled { opacity:.5; cursor:not-allowed; }
.eg-ib { flex:none; width:36px; height:36px; display:grid; place-items:center; padding:0; border:1px solid rgba(16,24,40,.16); background:rgba(255,255,255,.8); border-radius:9px; color:var(--ink, #101828); cursor:pointer; min-height:0; box-shadow:none; }
.eg-ib:hover { background:#fff; }
.eg-ib.on { background:var(--brand-50, #e7f3ee); border-color:var(--brand, #0f6b4a); color:var(--brand-700, #0b5c45); }
.eg-foothint { font-size:11.5px; color:#475467; display:flex; align-items:center; gap:6px; line-height:1.4; }
.eg-empty { padding:10px 4px; text-align:center; color:#475467; }

/* the help card */
.eg-help { display:none; position:absolute; left:50%; bottom:22px; transform:translateX(-50%); width:min(440px, calc(100% - 28px)); z-index:7; background:#fff; border:1px solid var(--line, #e4e7ec); border-radius:12px; box-shadow:0 14px 40px rgba(16,24,40,.35); padding:14px 16px 16px; }
.eg-help-h { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
.eg-help-h b { font-size:14.5px; font-weight:600; }
.eg-help-h button { width:28px; height:28px; border:0; background:transparent; border-radius:8px; display:grid; place-items:center; cursor:pointer; color:var(--muted, #667085); padding:0; min-height:0; box-shadow:none; }
.eg-help-h button:hover { background:var(--soft, #f2f4f7); }
.eg-step { display:flex; gap:11px; align-items:flex-start; padding:7px 0; }
.eg-stepi { flex:none; width:30px; height:30px; border-radius:8px; background:var(--brand-50, #e7f3ee); color:var(--brand-700, #0b5c45); display:grid; place-items:center; }
.eg-step b { display:block; font-size:13px; font-weight:600; }
.eg-step span:not(.eg-stepi) { display:block; font-size:12.5px; color:var(--muted, #667085); line-height:1.4; }
.eg-help .eg-go { margin-top:8px; width:100%; height:34px; }

/* tooltip and loading bar */
.eg-tip { display:none; position:absolute; z-index:9; pointer-events:none; background:rgba(16,24,40,.95); color:#fff; padding:7px 10px; border-radius:8px; font-size:12px; max-width:230px; line-height:1.35; box-shadow:0 6px 18px rgba(0,0,0,.35); }
.eg-tip b { display:block; font-weight:600; }
.eg-tip span { display:block; color:#cbd5e1; font-size:11px; }
.eg-tip em { display:block; font-style:normal; margin-top:3px; }
.eg-busy { position:absolute; left:0; right:0; top:0; height:3px; z-index:9; opacity:0; transition:opacity .2s; background:linear-gradient(90deg, transparent, var(--brand, #0f6b4a) 50%, transparent) no-repeat; background-size:40% 100%; animation:egslide 1.1s linear infinite; pointer-events:none; }
.eg-wait .eg-busy { opacity:1; }
@keyframes egslide { from { background-position:-40% 0; } to { background-position:140% 0; } }
@keyframes egin { from { opacity:0; } }

/* writing on the map: district names (country level), the names of the picked region's divisions, tank dots. They fade in and out. */
.eg-dl, .eg-vl, .eg-tk { transition:opacity .2s; }
.eg-vl, .eg-tk { animation:egin .25s ease-out backwards; }
.eg-off { opacity:0 !important; pointer-events:none !important; }
.eg-dl { color:#fff; font-size:10.5px; font-weight:600; letter-spacing:.11em; text-transform:uppercase; white-space:nowrap; pointer-events:none; text-shadow:0 0 3px rgba(5,15,25,.95), 0 0 7px rgba(5,15,25,.8), 0 1px 2px #000; }
.eg-light .eg-dl { color:#1e293b; text-shadow:0 0 3px #fff, 0 0 7px #fff; }
.eg-dl.has { display:flex; flex-direction:column; align-items:center; gap:1px; pointer-events:auto; cursor:pointer; letter-spacing:.03em; text-transform:none; }
.eg-dl.has b { background:#fff; color:var(--ink, #101828); padding:1px 7px; border-radius:6px; font-size:11.5px; font-weight:700; text-shadow:none; box-shadow:0 1px 6px rgba(0,0,0,.4); font-variant-numeric:tabular-nums; }
.eg-dl.has:hover b { background:var(--brand-50, #e7f3ee); }
.eg-dl.has span { font-size:11px; }
.eg-vl { display:flex; flex-direction:column; align-items:center; gap:1px; border:0; background:transparent; cursor:pointer; padding:0; min-height:0; box-shadow:none; }
.eg-vl b { background:#fff; color:var(--ink, #101828); padding:1px 7px; border-radius:6px; font-size:11.5px; font-weight:700; box-shadow:0 1px 6px rgba(0,0,0,.4); font-variant-numeric:tabular-nums; }
.eg-vl span { color:#fff; font-size:10.5px; font-weight:600; max-width:120px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-shadow:0 0 3px #000, 0 0 7px rgba(0,0,0,.85); }
.eg-vl.on b { background:var(--brand-700, #0b5c45); color:#fff; }
.eg-vl.on span { font-size:11.5px; }
.eg-light .eg-vl span { color:#1e293b; text-shadow:0 0 3px #fff, 0 0 7px #fff; }
.eg-tk { position:relative; width:16px; height:16px; border:0; background:transparent; padding:0; cursor:pointer; min-height:0; box-shadow:none; }
.eg-tk i { display:block; width:16px; height:16px; border-radius:50%; background:#fff; border:3.5px solid var(--brand-700, #0b5c45); box-shadow:0 1px 6px rgba(0,0,0,.55); transition:transform .15s; }
.eg-tk.est i { background:transparent; border:2px dashed #fff; box-shadow:0 0 0 1px rgba(0,0,0,.35); }

  function wipeFarmers() {

  // brings the farmer list up to date: asks for the chunks it does not hold, in steps, and stores them

  // ---------- the service records ----------

  // ---------- the change stamps ----------

  // ---------- starting and stopping ----------

    stop(false);

  // Farmer search for the screens: answered on the device when the list is there (instant), otherwise by the server function `server`

  function find(query, opts) {

      var L = st.layout = C.layout(model, st.expanded, hl && st.pathOnly ? hl.nodes : null);
      pathBtn.style.display = hl ? '' : 'none';
      pathBtn.textContent = st.pathOnly ? 'Whole map' : 'Only the path';
      clear(gEdges); clear(gHead); clear(gNodes); clear(gFarmer);
      st.farmerPill = null;

      L.headings.forEach(function (hd) {
        gHead.appendChild(s('text', { x: hd.x, y: hd.y, class: 'head', fill: pal(hd.lane).stroke, text: trunc(hd.text, 30) }, s('title', { text: hd.text })));
      });

      L.edges.forEach(function (e) {
        var x1 = e.from.x + C.NODE_W, y1 = e.from.y + C.NODE_H / 2, x2 = e.to.x, y2 = e.to.y + C.NODE_H / 2, xm = (x1 + x2) / 2;
        var lane = model.lanes[e.to.lane];
        var width = groupMode()
          ? 0.8 + 5 * Math.sqrt(st.group.count ? groupCount(e.to) / st.group.count : 0)
          : 0.8 + 5 * Math.sqrt(lane.farmers ? e.to.farmers / lane.farmers : 0);
        var cls = 'edge' + (hl ? (hl.nodes[e.from.id] && hl.nodes[e.to.id] ? ' hl' : ' dim') : '');
        gEdges.appendChild(s('path', { d: 'M' + x1 + ' ' + y1 + ' C' + xm + ' ' + y1 + ',' + xm + ' ' + y2 + ',' + x2 + ' ' + y2,
          class: cls, stroke: pal(e.to.lane).stroke, 'stroke-width': Math.min(5.5, width).toFixed(2) }));
      });

      L.nodes.forEach(function (n) { gNodes.appendChild(drawNode(n)); });
      if (groupMode() && st.group.count === 0) gHead.appendChild(s('text', { x: 30, y: 40, class: 'head', fill: HL, text: 'No farmers match these filters.' }));

      if (st.farmer && hl && hl.ends.length) {
        var ends = hl.ends.map(function (id) { return model.byId[id]; }).filter(function (n) { return n.y !== undefined && L.nodes.indexOf(n) !== -1; });
        if (ends.length) {
          var px = Math.max.apply(null, ends.map(function (n) { return n.x; })) + C.COL_W;
          var py = ends.reduce(function (sum, n) { return sum + n.y; }, 0) / ends.length;
          st.farmerPill = { x: px, y: py };
          ends.forEach(function (n) {
            var x1 = n.x + C.NODE_W, y1 = n.y + C.NODE_H / 2, x2 = px, y2 = py + C.NODE_H / 2, xm = (x1 + x2) / 2;
            gFarmer.appendChild(s('path', { d: 'M' + x1 + ' ' + y1 + ' C' + xm + ' ' + y1 + ',' + xm + ' ' + y2 + ',' + x2 + ' ' + y2, class: 'edge hl farmeredge' }));
          });
          var f = st.farmer.farmer;
          gFarmer.appendChild(s('g', { class: 'farmerpill', transform: 'translate(' + px + ',' + py + ')' },
            s('rect', { width: 190, height: C.NODE_H + 8, y: -4, rx: 14 }),
            s('text', { x: 95, y: 15, 'text-anchor': 'middle', text: trunc(f.full_name, 24) }),
            s('title', { text: f.full_name + ' (' + f.farmer_id + ')' })));
        }
      }
      applyView();
    }

    function drawNode(n) {
      var p = pal(n.lane), hl = st.hl;
      var inGroup = groupMode();
      var gc = inGroup ? groupCount(n) : 0;
      var parentFarmers = n.parent ? n.parent.farmers : 0;
      // The bar under a box: its share of the box above, or (for a group) the part of its own farmers who are in the group.
      var share = inGroup ? (n.farmers ? gc / n.farmers : 0) : (n.kind === 'lane' ? 1 : (parentFarmers ? n.farmers / parentFarmers : 0));
      var open = n.children.length && st.expanded[n.id];
      var cls = 'node' + (n.kind === 'lane' ? ' lane' : '') + (st.selected === n.id ? ' sel' : '') + (hl ? (hl.nodes[n.id] ? ' hl' : ' dim') : '') +
        (n.active ? '' : ' ghost') + (n.farmers ? '' : ' zero');
      var g = s('g', { class: cls, transform: 'translate(' + n.x + ',' + n.y + ')', onclick: function () { if (!st.moved) clickNode(n); } },
        s('rect', { width: C.NODE_W, height: C.NODE_H, rx: 6, fill: p.fill, stroke: p.stroke }),
        s('rect', { class: 'bar', x: 0, y: C.NODE_H - 3, width: C.NODE_W * share, height: 3, fill: inGroup ? HL : p.stroke }),
        s('text', { class: 'lbl', x: 9, y: 18, text: trunc(n.label, inGroup ? (n.children.length ? 19 : 21) : (n.children.length ? 25 : 27)) }),
        s('text', { class: 'badge', x: C.NODE_W - (n.children.length ? 26 : 9), y: 18, 'text-anchor': 'end', text: inGroup ? fmt(gc) + '/' + fmt(n.farmers) : fmt(n.farmers) }),
        n.children.length ? s('text', { class: 'exp', x: C.NODE_W - 12, y: 18, 'text-anchor': 'middle', text: open ? '▾' : '▸' }) : null,
        s('title', { text: n.label + (n.active ? '' : ' (hidden)') + '\n' + (inGroup ? fmt(gc) + ' of ' + fmt(n.farmers) + ' farmers here are in the group\n' : '') +
          fmt(n.farmers) + ' farmers, ' + fmt(n.acres) + ' acres' +
          (n.kind === 'option' && n.children.length ? '\n' + fmt(n.farmers - n.stops) + ' go on to the options below, ' + fmt(n.stops) + ' stop here' : '') +
          (n.gate ? '\n' + n.gate : '') }));
      return g;
    }

    function clickNode(n) {
      st.selected = n.id;
      if (st.hl && st.pathOnly) {
        // Nothing hidden to open while only the path is shown; the box is just selected.
        redraw();
      } else if (n.children.length) {
        st.expanded[n.id] = !st.expanded[n.id];
        redraw();
      } else {
        redraw();
      }
      renderPanel();
    }

    // ----- farmer search and highlight -----
    function searchFarmers() {
      hideMsg();
      Sync.find(fInput.value, { limit: 50, server: 'findFarmers' }).then(function (rows) {
        clear(fResults);
        if (!rows.length) { fResults.appendChild(h('div', { class: 'popitem none', text: 'No farmers found.' })); fResults.className = 'pop open'; return; }
        rows.slice(0, 10).forEach(function (r) {
          fResults.appendChild(h('div', { class: 'popitem', onclick: function () { pickFarmer(r.farmer_id); } },
            h('b', { text: r.full_name }), h('small', { text: ' ' + r.farmer_id + ' · ' + r.ds_division + ', ' + r.district })));
        });
        if (rows.length > 10) fResults.appendChild(h('div', { class: 'popitem none', text: 'Showing 10 of ' + rows.length + '. Type more of the name to narrow it down.' }));
        fResults.className = 'pop open';
      }).catch(function (e) { showMsg(e.message, true); });
    }
    function pickFarmer(id) {
      fResults.className = 'pop';
      Sync.fast('getFarmerOrigin', [id], { strict: true }).then(function (data) {
        st.farmer = data;
        st.group = null;
        st.pathOnly = true;
        st.hl = C.focus(model, data.option_ids);
        st.expanded = C.expandFor(model, st.expanded, data.option_ids);
        st.selected = null;
        redraw();
        var nodes = Object.keys(st.hl.nodes).map(function (nid) { return model.byId[nid]; }).filter(function (n) { return n.y !== undefined; });
        fitBox(boundsOf(nodes), true);
        renderPanel();
        if (!data.option_ids.length) showMsg(data.farmer.full_name + ' has no origin recorded yet.', true);
      }).catch(function (e) { showMsg(e.message, true); });
    }
    function showNodeResults() {
      clear(nResults);
      var hits = C.search(model, nInput.value, 12);
      if (!hits.length) { nResults.className = 'pop'; return; }
      hits.forEach(function (n) {
        nResults.appendChild(h('div', { class: 'popitem', onclick: function () { focusNode(n); } },
          h('b', { text: n.label }), h('small', { text: ' ' + n.gate + ' · ' + fmt(n.farmers) + ' farmers' })));
      });
      nResults.className = 'pop open';
    }
    function focusNode(n) {
      nResults.className = 'pop';
      st.farmer = null;
      st.group = null;
      st.pathOnly = true;
      st.hl = C.focus(model, [n.id]);
      st.expanded = C.expandFor(model, st.expanded, [n.id]);
      st.selected = n.id;
      redraw();
      var nodes = Object.keys(st.hl.nodes).map(function (nid) { return model.byId[nid]; }).filter(function (x) { return x.y !== undefined; });
      fitBox(boundsOf(nodes), true);
      renderPanel();
    }
    function clearHighlight() {
      st.farmer = null; st.group = null; st.hl = null; st.selected = null;
      redraw(); home(true); renderPanel();
    }

    // The finder found a group: light up every box that has some of them, and show only those routes.
    function applyGroup(res) {
      st.farmer = null;
      st.group = res;
      st.selected = null;
      var on = {};
      Object.keys(res.nodes).forEach(function (id) { if (model.byId[id] && res.nodes[id] > 0) on[id] = true; });
      model.lanes.forEach(function (l) { if (res.lanes[l.lane] > 0) on[l.id] = true; });
      st.hl = { nodes: on, ends: [], missing: [] };
      st.pathOnly = true;
      redraw();
      if (res.count) fitBox(boundsOf(st.layout.nodes), true); else home(true);
      renderPanel();
      mapBox.scrollIntoView({ behavior: 'smooth', block: 'start' });   // the map sits below the filters
    }
    // The finder was cleared: the map goes back to normal.
    function clearGroup() {
      st.group = null;
      if (!st.farmer) { st.hl = null; st.selected = null; redraw(); home(true); }
      renderPanel();
    }
    document.addEventListener('click', function (e) {
      if (!toolbar.contains(e.target)) { fResults.className = 'pop'; nResults.className = 'pop'; }
    });

    // ----- side panel -----
    function stat(label, value) { return h('div', { class: 'stat' }, h('b', { text: value }), h('small', { text: label })); }
    function renderPanel() {
      clear(side);
      var T = model.totals;
      if (st.farmer) {
        var f = st.farmer.farmer;
        side.appendChild(h('h2', { text: f.full_name }));
        side.appendChild(h('p', { class: 'hint', text: f.farmer_id + ' · ' + f.village + ', ' + f.ds_division + ', ' + f.district }));
        side.appendChild(h('div', { class: 'stats' }, stat('acres', fmt(st.farmer.total_acres)), stat('origin paths', String(st.hl.ends.length))));
        if (!st.hl.ends.length) side.appendChild(h('p', { text: 'No origin has been recorded for this farmer.' }));
        st.hl.ends.forEach(function (id, i) {
          var n = model.byId[id];
          side.appendChild(h('div', { class: 'chain' }, h('b', { text: 'Path ' + (i + 1) + ' · ' + C.laneLabel(n) }),
            h('div', {}, C.ancestors(n).filter(function (x) { return x.kind === 'option'; }).map(function (x, j) {
              return h('div', { class: 'step', text: (j ? '↳ ' : '') + x.label });
            }))));
        });
        if (st.hl.missing.length) side.appendChild(h('p', { class: 'hint', text: st.hl.missing.length + ' answer(s) point at options that are not on the map.' }));
        side.appendChild(h('div', { style: 'margin-top:10px' },
          h('button', { class: 's', type: 'button', text: 'Open profile and log book', onclick: function () { Nav.openFarmer(f.farmer_id); } }), ' ',
          h('button', { class: 's', type: 'button', text: 'Clear', onclick: clearHighlight })));
        return;
      }
      if (st.selected && model.byId[st.selected]) {
        var n = model.byId[st.selected];
        side.appendChild(h('h2', { text: n.label }));
        side.appendChild(h('p', { class: 'hint', text: n.kind === 'lane' ? 'Route' : n.gate + (n.active ? '' : ' · hidden in the designer') }));
        side.appendChild(h('div', { class: 'stats' }, stat('farmers', fmt(n.farmers)), stat('acres', fmt(n.acres)),
          stat('of ' + (n.kind === 'lane' ? 'all farmers' : 'its parent'), n.kind === 'lane'
            ? (T.farmers ? Math.round(100 * n.farmers / T.farmers) : 0) + '%'
            : (n.parent && n.parent.farmers ? Math.round(100 * n.farmers / n.parent.farmers) : 0) + '%')));
        if (groupMode()) side.appendChild(h('p', { class: 'ingroup', text: 'In the group: ' + fmt(groupCount(n)) + ' of ' + fmt(n.farmers) + ' farmers here.' }));
        if (n.kind === 'option') {
          side.appendChild(h('div', { class: 'maptools' },
            h('button', { class: 's', type: 'button', text: 'Find farmers under this box', title: 'Adds this box to the finder filters', onclick: function () { finder.addOrigin(n.id, 'under'); } }),
            n.stops > 0 ? h('button', { class: 's', type: 'button', text: 'Find the ' + fmt(n.stops) + ' who stop here', onclick: function () { finder.addOrigin(n.id, 'ends_at'); } }) : null));
        }
        if (n.kind === 'option' && n.children.length) {
          side.appendChild(h('div', { class: 'stats' }, stat('go on to the boxes below', fmt(n.farmers - n.stops)), stat('stop here', fmt(n.stops))));
          side.appendChild(h('p', { class: 'hint', text: 'The next choice is optional, so some farmers stop here. A farmer who picks more than one box below is counted in each, so those numbers can add up to more than the first figure.' }));
        }
        if (n.kind === 'option') side.appendChild(h('p', { class: 'hint', text: C.laneLabel(n) + ' › ' + C.pathText(n) }));
        side.appendChild(h('p', { text: n.children.length ? n.children.length + ' item' + (n.children.length === 1 ? '' : 's') + ' directly below.' : 'Nothing below this box.' }));
        return;
      }
      if (groupMode()) {
        var gr = st.group;
        side.appendChild(h('h2', { text: 'The group' }));
        side.appendChild(h('div', { class: 'stats' }, stat('farmers', fmt(gr.count)), stat('acres', fmt(gr.acres)),
          stat('of all farmers', (T.farmers ? Math.round(100 * gr.count / T.farmers) : 0) + '%')));
        model.lanes.forEach(function (l) {
          side.appendChild(h('div', { class: 'lanerow' }, h('i', { style: 'background:' + pal(l.lane).stroke }), h('b', { text: ' ' + l.label }),
            h('div', { class: 'hint', text: fmt(gr.lanes[l.lane] || 0) + ' of the group come through this route' })));
        });
        if (gr.byDistrict.length) {
          side.appendChild(h('h3', { text: 'By district' }));
          gr.byDistrict.slice(0, 8).forEach(function (d) {
            side.appendChild(h('div', { class: 'distrow' }, h('span', { text: d.name }), h('b', { text: fmt(d.farmers) }),
              h('i', { class: 'distbar', style: 'width:' + Math.max(3, Math.round(100 * d.farmers / gr.count)) + '%' })));
          });
        }
        side.appendChild(h('p', { class: 'hint', text: 'Each box shows how many of its farmers are in the group. Click a box to see its numbers, or "Show surrounding map" to see where the group sits in the whole map.' }));
        side.appendChild(h('button', { class: 's', type: 'button', text: 'Clear', onclick: clearHighlight }));
        return;
      }
      side.appendChild(h('h2', { text: 'Overview' }));
      side.appendChild(h('div', { class: 'stats' }, stat('active farmers', fmt(T.farmers)), stat('with an origin', fmt(T.withOrigin)), stat('acres', fmt(T.acres))));
      model.lanes.forEach(function (l) {
        side.appendChild(h('div', { class: 'lanerow', onclick: function () { st.selected = l.id; redraw(); renderPanel(); } },
          h('i', { style: 'background:' + pal(l.lane).stroke }), h('b', { text: ' ' + l.label }),
          h('div', { class: 'hint', text: fmt(l.farmers) + ' farmers · ' + fmt(l.acres) + ' acres' })));
      });
      side.appendChild(h('p', { class: 'hint', text: 'A farmer can come through both routes, so the two numbers can add up to more than the total.' }));
    }

    redraw();
    renderPanel();
    home(false);
  }

  return { mount: mount };
})();
</script>

  <script>
// "Earth": the satellite map of Sri Lanka. The map fills the whole screen. Only small things sit on top of it:
//   top left   the search box and a path bar (Sri Lanka > District > Division > Tank > Committee) to pick a place level by level,
//   top right  a small translucent legend with the figures of whatever the map is focused on (the whole country, a division ...),
//   left edge  a few icon tools, bottom left a colour scale.
// Tapping the map drills down one level (country > district > division), the map zooms to the picked place and shows the next level.
// How it works: the farmers have no map coordinates, so the map colours the Divisional Secretariat divisions (boundaries from
// geoBoundaries, in EarthGeo.gs). Tanks are pins, Govi committees are reached through the path bar (they have no place on the map).
// getEarthData(period) sends a small "cube" (one row per district / division / tank / committee combination with farmers and the
// services of the chosen period) and this file adds up whatever the user picks, so changing the place or the figure is instant;
// changing the period asks the server again. Free map pieces: satellite pictures (Esri), terrain (AWS Terrain Tiles), MapLibre GL.
var Earth = (function () {
  var LIB_JS = 'https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js';
  var LIB_CSS = 'https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css';
  var DEM = 'https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png';
  var LIGHT = 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}';
  var ISLAND = [[79.55, 5.85], [82.0, 9.95]];
  var RAMP = ['#e3f4ea', '#a9dcc3', '#63bc98', '#26926f', '#0a5c44'];
  var GREY = '#8795a1';
  var AMBER = '#f5b83d';
  var HELP_KEY = 'govilink_map_help2';
  var libPromise = null;
  var memo = null;   // what the user was looking at, so coming back from another screen (for example after writing a message) keeps the place

  function loadLib() {
    if (window.maplibregl) return Promise.resolve();
    if (libPromise) return libPromise;
    libPromise = new Promise(function (resolve, reject) {
      var css = document.createElement('link'); css.rel = 'stylesheet'; css.href = LIB_CSS; document.head.appendChild(css);
      var s = document.createElement('script'); s.src = LIB_JS;
      s.onload = resolve;
      s.onerror = function () { libPromise = null; reject(new Error('The map could not be loaded. Check the internet connection.')); };
      document.head.appendChild(s);
    });
    return libPromise;
  }
  function hasWebGL() {
    try { var c = document.createElement('canvas'); return !!(window.WebGLRenderingContext && (c.getContext('webgl') || c.getContext('experimental-webgl'))); } catch (e) { return false; }
  }

  // ---------- small helpers ----------
  function n0(x) { return Math.round(Number(x) || 0).toLocaleString(); }
  function ac(x) { x = Number(x) || 0; return x >= 100 ? Math.round(x).toLocaleString() : String(Math.round(x * 10) / 10); }
  function pad2(x) { return (x < 10 ? '0' : '') + x; }
  function dayString(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  function daysAgo(k) { var d = new Date(); d.setDate(d.getDate() - k); return dayString(d); }
  function norm(s) { return String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, ''); }
  function dkey(s) { return String(s || '').toLowerCase().replace(/[^a-z]/g, ''); }
  function hex(c) { return [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)]; }
  function mix(a, b, t) {
    var x = hex(a), y = hex(b);
    return '#' + [0, 1, 2].map(function (i) { return ('0' + Math.round(x[i] + (y[i] - x[i]) * t).toString(16)).slice(-2); }).join('');
  }
  function rampColor(t) {
    t = Math.max(0, Math.min(1, t)) * (RAMP.length - 1);
    var i = Math.min(RAMP.length - 2, Math.floor(t));
    return mix(RAMP[i], RAMP[i + 1], t - i);
  }
  function circle(lon, lat, km) {
    var pts = [];
    for (var i = 0; i <= 24; i++) {
      var a = i / 24 * Math.PI * 2;
      pts.push([lon + (km / 111.32 / Math.cos(lat * Math.PI / 180)) * Math.cos(a), lat + (km / 110.57) * Math.sin(a)]);
    }
    return { type: 'Polygon', coordinates: [pts] };
  }
  function arc(a, b, bend) {
    var mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2, dx = b[0] - a[0], dy = b[1] - a[1];
    var cx = mx - dy * bend, cy = my + dx * bend, pts = [];
    for (var i = 0; i <= 20; i++) {
      var t = i / 20, u = 1 - t;
      pts.push([u * u * a[0] + 2 * u * t * cx + t * t * b[0], u * u * a[1] + 2 * u * t * cy + t * t * b[1]]);
    }
    return pts;
  }
  function bboxOf(geometry) {
    var b = [180, 90, -180, -90];
    (function walk(c) {
      if (typeof c[0] === 'number') { b[0] = Math.min(b[0], c[0]); b[1] = Math.min(b[1], c[1]); b[2] = Math.max(b[2], c[0]); b[3] = Math.max(b[3], c[1]); }
      else for (var i = 0; i < c.length; i++) walk(c[i]);
    })(geometry.coordinates);
    return b;
  }
  function emptyFC() { return { type: 'FeatureCollection', features: [] }; }
  function hasClass(el, c) { return (' ' + el.className + ' ').indexOf(' ' + c + ' ') >= 0; }
  function setClass(el, c, on) {
    var has = hasClass(el, c);
    if (on && !has) el.className = (el.className + ' ' + c).replace(/^\s+/, '');
    else if (!on && has) el.className = el.className.replace(new RegExp('(^|\\s)' + c + '(?=\\s|$)', 'g'), ' ').replace(/\s+/g, ' ').replace(/^\s+|\s+$/g, '');
  }
  function drawIcon(inner) { var s = icon('map'); s.innerHTML = inner; return s; }

  // ---------- what can be shown ----------
  // the figures of one group of farmers: f farmers, a registered acres, s farmers served, m missions, z acres covered, r rating total, rn ratings
  function emptyAgg() { return { f: 0, a: 0, s: 0, m: 0, z: 0, r: 0, rn: 0 }; }
  function addRow(a, r) { a.f += r[4]; a.a += r[5]; a.s += r[6]; a.m += r[7]; a.z += r[8]; a.r += r[9]; a.rn += r[10]; }
  var METRICS = {
    missions: { label: 'Missions', note: 'services done', val: function (a) { return a.m; }, has: function (a) { return a.m > 0; }, text: function (a) { return n0(a.m); } },
    acres: { label: 'Acres covered', note: 'sprayed, repeats counted', val: function (a) { return a.z; }, has: function (a) { return a.z > 0; }, text: function (a) { return ac(a.z); } },

  function when(iso) { if (!iso) return 'never'; var d = new Date(iso); return isNaN(d.getTime()) ? String(iso) : d.toLocaleDateString(undefined, { day: 'numeric', month: 'short' }); }
  function rolePicker(current, onChange) {
    return tilePicker(ROLES.map(function (r) { return { value: r[0], label: r[1], icon: r[2], color: r[3] }; }), current, onChange);
  }

  function passwordField(label, placeholder) {
    var input = h('input', { type: 'password', autocomplete: 'new-password', maxlength: 100, placeholder: placeholder || null });
    var show = h('input', { type: 'checkbox', onchange: function (e) { input.type = e.target.checked ? 'text' : 'password'; } });
    return { input: input, row: h('div', { class: 'fld' }, h('label', { class: 'f', text: label }), input, h('label', { class: 'inl' }, show, ' Show')) };
  }

  function mount(el) {
    var users = [];
    var open = null;   // { id, mode: 'edit' | 'reset' }
    var listBox = h('div');
    var me = Session.user;

    function load() {
      return softFetch(listBox, Sync.fast('listUsers', [], { strict: true }), function (rows) { users = rows; drawCards(); });
    }
    function act(promise, done) {
      hideMsg();
      return promise.then(function () { open = null; showMsg(done, false); return load(); }).catch(function (e) { showMsg(e.message, true); });
    }

    function panel(u) {
      if (!open || open.id !== u.user_id) return null;
      if (open.mode === 'reset') {
        var pw = passwordField('New password', '8+ characters, a letter and a number');
        var must = h('input', { type: 'checkbox', checked: true });
        return h('div', { class: 'fieldrow' }, pw.row, h('div', { class: 'checks' }, h('label', {}, must, ' They choose their own next time')),
          h('div', { style: 'margin-top:8px;display:flex;gap:10px' },
            h('button', { class: 'b', type: 'button', onclick: function () { act(call('resetUserPassword', u.user_id, pw.input.value, must.checked), 'Password set'); } }, icon('check'), 'Set'),
            h('button', { class: 's', type: 'button', onclick: function () { open = null; draw(); } }, icon('x'))));
      }
      var name = h('input', { type: 'text', value: u.name, maxlength: 80 });
      var label = h('input', { type: 'text', value: u.label || '', maxlength: 60, placeholder: 'Team or branch (optional)' });
      var emailBox = h('input', { type: 'text', value: u.email, maxlength: 120, disabled: !!u.roleLabel });
      var rp = me.user_id === u.user_id || u.roleLabel ? null : rolePicker(u.role);
      return h('div', { class: 'fieldrow' },
        h('div', { class: 'grid3' }, h('div', { class: 'fld' }, h('label', { class: 'f', text: 'Name' }), name), h('div', { class: 'fld' }, h('label', { class: 'f', text: 'Team' }), label),
          me.tools ? h('div', { class: 'fld' }, h('label', { class: 'f', text: 'Email' }), emailBox) : null),
        rp ? h('div', { class: 'fld' }, h('label', { class: 'f', text: 'Role' }), rp.el) : null,
        h('div', { style: 'margin-top:8px;display:flex;gap:10px' },
          h('button', { class: 'b', type: 'button', onclick: function () {
            var input = { name: name.value, label: label.value };
            if (me.tools && !u.roleLabel && emailBox.value.trim().toLowerCase() !== u.email) input.email = emailBox.value;
            if (rp && rp.get() && rp.get() !== u.role) input.role = rp.get();
            act(call('updateUser', u.user_id, input), 'Saved');
          } }, icon('check'), 'Save'),
          h('button', { class: 's', type: 'button', onclick: function () { open = null; draw(); } }, icon('x'))),
        me.tools && u.user_id !== me.user_id && !u.roleLabel ? deletePanel(u) : null);
    }

    // Permanent removal (shown to the one account that may do it). The account's email must be typed to confirm.
    function deletePanel(u) {
      var box = h('div', { style: 'margin-top:16px; padding-top:14px; border-top:1px solid var(--line)' });
      function closed() { softShow(box, drawClosed); }
      function opened() { softShow(box, drawOpened); }
      function drawClosed() {
        box.appendChild(h('button', { class: 's', type: 'button', style: 'color:var(--red)', onclick: opened }, icon('trash'), 'Delete…'));
      }
      function drawOpened() {
        var typed = h('input', { type: 'text', placeholder: u.email, autocomplete: 'off', maxlength: 120 });
        var go = h('button', { class: 'b danger', type: 'button', disabled: true, onclick: function () { act(call('deleteUser', u.user_id, typed.value), 'Deleted'); } }, icon('trash'), 'Delete for good');
        typed.addEventListener('input', function () { go.disabled = typed.value.trim().toLowerCase() !== u.email; });
        box.appendChild(h('p', { class: 'hint', text: 'Type ' + u.email + ' to confirm. Switching off instead can be undone.' }));
        box.appendChild(h('div', { class: 'searchrow' }, typed, go, h('button', { class: 's', type: 'button', onclick: closed }, icon('x'))));
      }
      drawClosed();

    }

    function round(iconName, label, onclick, extra) {

    }

    // choosing something on a card swaps the cards in one step (the list glides to its new height); the answer from the server does the same
    function draw() { softShow(listBox, drawCards); }
    function drawCards() {
      users.forEach(function (u) {
        var isMe = u.user_id === me.user_id;
        var r = role(u.role);
        var chips = [h('span', { class: 'pill ' + ({ green: 'green', sky: 'blue', sun: 'amber', violet: 'violet' }[r[3]] || '') }, icon(r[2]), roleName(u.role, u))];
        if (u.active !== 'Yes') chips.push(h('span', { class: 'pill red' }, icon('x'), 'Off'));
        if (u.locked) chips.push(h('span', { class: 'pill amber' }, icon('lock'), 'Locked'));
        if (u.must_change) chips.push(h('span', { class: 'pill blue' }, icon('key'), 'New password'));
        if (!u.has_password) chips.push(h('span', { class: 'pill red' }, icon('key'), 'No password'));
        listBox.appendChild(h('div', { class: 'card', style: 'padding:16px;margin-bottom:12px' + (u.active === 'Yes' ? '' : ';opacity:.6') },
          h('div', { class: 'profilehead' }, h('span', { class: 'avatar md', text: initials(u.name) }),
            h('div', { style: 'flex:1;min-width:180px' }, h('h2', { text: u.name + (isMe ? ' (you)' : ''), style: 'font-size:18px' }), h('div', { class: 'meta', text: u.email + (u.label ? ' · ' + u.label : '') }),
              h('div', { style: 'display:flex;gap:6px;flex-wrap:wrap;margin-top:6px' }, chips, h('span', { class: 'pill' }, icon('clock'), when(u.last_login)))),
            h('div', { style: 'display:flex;gap:8px;flex-wrap:wrap' },
              round('edit', 'Edit', function () { open = { id: u.user_id, mode: 'edit' }; draw(); }),
              round('key', 'Set password', function () { open = { id: u.user_id, mode: 'reset' }; draw(); }),
              u.locked ? round('lock', 'Unlock', function () { act(call('unlockUser', u.user_id), 'Unlocked'); }, 'color:var(--sun)') : null,
              isMe ? null : round(u.active === 'Yes' ? 'x' : 'check', u.active === 'Yes' ? 'Switch off' : 'Switch on',
                function () { act(call('updateUser', u.user_id, { active: u.active !== 'Yes' }), u.active === 'Yes' ? 'Switched off' : 'Switched on'); }, u.active === 'Yes' ? 'color:var(--red)' : 'color:var(--brand)'))),
          panel(u)));
      });
    }

    // ---- new person
    var addBox = h('div', { style: 'display:none' });
    var nName = h('input', { type: 'text', maxlength: 80, placeholder: 'Name' });
    var nEmail = h('input', { type: 'text', maxlength: 120, autocomplete: 'off', placeholder: 'Email' });
    var nLabel = h('input', { type: 'text', maxlength: 60, placeholder: 'Team or branch (optional)' });
    var roleHelp = h('p', { class: 'hint', text: ROLES[0][4] });
    var nRole = rolePicker('DataEntry', function (v) { roleHelp.textContent = v ? role(v)[4] : ''; });
    var nPw = passwordField('Password', '8+ characters, a letter and a number');
    var nMust = h('input', { type: 'checkbox', checked: true });
    var addBtn = h('button', { class: 'b big', type: 'button', onclick: create }, icon('check'), 'Create');
    function create() {
      hideMsg();
      setBusy(addBtn, true);
      call('createUser', { name: nName.value, email: nEmail.value, role: nRole.get(), label: nLabel.value, password: nPw.input.value, must_change: nMust.checked })
        .then(function () {
          showMsg('Created. Give them the email and the password.', false);
          nName.value = ''; nEmail.value = ''; nLabel.value = ''; nPw.input.value = '';
          setBusy(addBtn, false); slideTo(addBox, false);
          return load();
        }).catch(function (e) { setBusy(addBtn, false); showMsg(e.message, true); });
    }
    addBox.appendChild(h('div', { class: 'card' }, h('div', { class: 'cardhead' }, h('h2', {}, ico('userplus', 'green', 'sm'), 'New person')),
      nRole.el, roleHelp,
      h('div', { class: 'grid3' }, h('div', { class: 'fld' }, h('label', { class: 'f', text: 'Name' }), nName), h('div', { class: 'fld' }, h('label', { class: 'f', text: 'Email' }), nEmail), nPw.row),
      h('div', { class: 'fld' }, h('label', { class: 'f', text: 'Team' }), nLabel),
      h('div', { class: 'checks' }, h('label', {}, nMust, ' They choose their own password at first sign-in')),
      h('div', { style: 'margin-top:12px' }, addBtn)));

    el.appendChild(h('div', { style: 'display:flex;justify-content:flex-end;margin-bottom:14px' },
      h('button', { class: 'b', type: 'button', onclick: function () { slideTo(addBox, addBox.style.display === 'none'); } }, icon('plus'), 'New person')));
    el.appendChild(addBox);
    el.appendChild(listBox);
    load();
  }
  return { mount: mount };
})();
