  <script>
// The first screen after signing in: a greeting, a time range, the figures of that range (tap one for its chart), quick actions and the latest
// services. Managers and admins see the whole business; a pilot sees their own work.
//
// Every figure is worked out on the device from the copy of the services and farmers that Sync.html keeps up to date, so choosing another
// time range (or coming back to this screen) shows the new figures at once, with no waiting for the server. Each figure card opens a pop-up
// with charts that belong to it. The chosen range is remembered on this device.
var Home = (function () {
  var RANGE_KEY = 'govilink_home_range';
  var PRESETS = [['today', 'Today'], ['7d', '7 days'], ['30d', '30 days'], ['month', 'This month'], ['90d', '3 months'], ['year', 'This year'], ['all', 'All time'], ['custom', 'Custom']];
  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var MONTHS_LONG = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  var DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

  function n(x) { return Number(x).toLocaleString(); }
  function ac(x) { return Math.round(x * 10) / 10; }
  function pct(a, b) { return b > 0 ? Math.round(a / b * 100) : 0; }

  // ---------- dates (days are 'YYYY-MM-DD' text, like everywhere else) ----------
  function shift(iso, d) { return new Date(Date.parse(iso + 'T00:00:00Z') + d * 86400000).toISOString().slice(0, 10); }
  function diff(a, b) { return Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / 86400000); }
  function fmt(iso, year) { var p = String(iso).split('-'); return Number(p[2]) + ' ' + MONTHS[Number(p[1]) - 1] + (year ? ' ' + p[0] : ''); }
  function rangeText(from, to) {
    if (from === to) return fmt(from, true);
    return fmt(from, from.slice(0, 4) !== to.slice(0, 4)) + ' – ' + fmt(to, true);
  }
  function validDay(s) { return /^\d{4}-\d{2}-\d{2}$/.test(String(s || '')) && !isNaN(Date.parse(s + 'T00:00:00Z')); }

  function loadSel() {
    try { var s = JSON.parse(window.localStorage.getItem(RANGE_KEY) || 'null'); if (s && PRESETS.some(function (p) { return p[0] === s.k; })) return s; } catch (e) { /* no saved choice */ }
    return { k: '30d' };
  }
  function saveSel(sel) { try { window.localStorage.setItem(RANGE_KEY, JSON.stringify(sel)); } catch (e) { /* the choice is just not remembered */ } }

  // The chosen range as real days, with the same number of days just before it for comparison (not for "all time").
  function rangeOf(sel, today, first) {
    var from = today, to = today, label = 'Today';
    if (sel.k === '7d') { from = shift(today, -6); label = 'Last 7 days'; }
    else if (sel.k === '30d') { from = shift(today, -29); label = 'Last 30 days'; }
    else if (sel.k === 'month') { from = today.slice(0, 8) + '01'; label = 'This month'; }
    else if (sel.k === '90d') { from = shift(today, -89); label = 'Last 3 months'; }
    else if (sel.k === 'year') { from = today.slice(0, 4) + '-01-01'; label = 'This year'; }
    else if (sel.k === 'all') { from = first && first < today ? first : today; label = 'All time'; }
    else if (sel.k === 'custom') {
      from = validDay(sel.from) ? sel.from : shift(today, -29); to = validDay(sel.to) ? sel.to : today;
      if (to > today) to = today;
      if (from > to) from = to;
      label = 'Chosen dates';
    }
    var days = diff(from, to) + 1;
    var prev = null;
    if (sel.k !== 'all') { var pto = shift(from, -1); prev = { from: shift(pto, -(days - 1)), to: pto }; }
    return { k: sel.k, from: from, to: to, days: days, label: label, prev: prev, text: rangeText(from, to) };
  }

  // ---------- adding up ----------
  var C = Sync.COL;
  function activeTest(lead) {
    if (!lead || !Sync.farmers.ready()) return function () { return true; };
    return function (id) { var r = Sync.farmers.row(id); return !!r && r[8] === 'Active'; };
  }
  function agg(list, farmerOK) {
    var o = { acres: 0, count: 0, byFarmer: {}, servedN: 0, rSum: 0, rN: 0, ratings: [0, 0, 0, 0, 0, 0], byType: {}, byPilot: {}, byDay: {}, list: list };
    list.forEach(function (r) {
      var a = r[C.ACRES], t = r[C.TYPE] || 'Not recorded', p = r[C.PILOT] || '';
      o.acres += a; o.count++;
      var bt = o.byType[t] = o.byType[t] || { c: 0, a: 0 }; bt.c++; bt.a += a;
      var bp = o.byPilot[p] = o.byPilot[p] || { c: 0, a: 0 }; bp.c++; bp.a += a;
      var bd = o.byDay[r[C.DAY]] = o.byDay[r[C.DAY]] || { c: 0, a: 0 }; bd.c++; bd.a += a;
      if (farmerOK(r[C.FARMER])) o.byFarmer[r[C.FARMER]] = (o.byFarmer[r[C.FARMER]] || 0) + 1;
      if (r[C.RATING]) { o.rSum += r[C.RATING]; o.rN++; o.ratings[r[C.RATING]]++; }
    });
    o.servedN = Object.keys(o.byFarmer).length;
    o.avg = o.rN ? o.rSum / o.rN : 0;
    return o;
  }
  // everything the screen shows, for one range
  function compute(sel, lead) {
    var rows = Sync.services.rows().filter(function (r) { return r[C.STATUS] === 'Completed' && r[C.DAY]; });
    var first = '';
    rows.forEach(function (r) { if (!first || r[C.DAY] < first) first = r[C.DAY]; });
    var range = rangeOf(sel, Sync.today(), first);
    var ok = activeTest(lead);
    function within(a, b) { return rows.filter(function (r) { return r[C.DAY] >= a && r[C.DAY] <= b; }); }
    var D = { range: range, lead: lead, rows: rows, ok: ok, cur: agg(within(range.from, range.to), ok), prev: range.prev ? agg(within(range.prev.from, range.prev.to), ok) : null, first: first };
    D.farmersReady = lead && Sync.farmers.ready();
    if (D.farmersReady) {
      D.active = 0; D.newFarmers = 0;
      Sync.farmers.raw().forEach(function (f) {
        if (f[8] !== 'Active') return;
        D.active++;
        if (f[14] && f[14] >= range.from && f[14] <= range.to) D.newFarmers++;
      });
    }
    D.messages = 0; D.messageFarmers = 0;
    if (lead) Sync.services.messages().forEach(function (m) { if (m[0] >= range.from && m[0] <= range.to) { D.messages++; D.messageFarmers += m[1]; } });
    return D;
  }

  // ---------- time series ----------
  function granOf(days) { return days <= 45 ? 'day' : (days <= 210 ? 'week' : 'month'); }
  function monthIndex(iso) { var p = iso.split('-'); return Number(p[0]) * 12 + Number(p[1]) - 1; }
  // The slices of a window of days: a day each, a week each (from the first day) or a calendar month each.
  function buckets(from, to, g) {
    var list = [], i;
    if (g === 'day') { for (i = 0; i <= diff(from, to); i++) { var d = shift(from, i); list.push({ from: d, to: d }); } }
    else if (g === 'week') { for (i = 0; i <= diff(from, to); i += 7) list.push({ from: shift(from, i), to: shift(from, Math.min(i + 6, diff(from, to))) }); }
    else {
      var m0 = monthIndex(from), m1 = monthIndex(to);
      for (var m = m0; m <= m1; m++) {
        var y = Math.floor(m / 12), mo = m % 12 + 1, s = y + '-' + (mo < 10 ? '0' : '') + mo + '-01';
        var nextY = mo === 12 ? y + 1 : y, nextM = mo === 12 ? 1 : mo + 1;
        var e = shift(nextY + '-' + (nextM < 10 ? '0' : '') + nextM + '-01', -1);
        list.push({ from: s < from ? from : s, to: e > to ? to : e });
      }
    }
    list.index = function (day) {
      if (g === 'day') return diff(from, day);
      if (g === 'week') return Math.floor(diff(from, day) / 7);
      return monthIndex(day) - monthIndex(from);
    };
    list.g = g;
    return list;
  }
  function bucketTitle(b, g) {
    if (g === 'day') return fmt(b.from);
    if (g === 'week') return fmt(b.from) + ' – ' + fmt(b.to);
    var p = b.from.split('-'); return MONTHS_LONG[Number(p[1]) - 1] + ' ' + p[0];
  }
  function xLabel(g) { return function (p) { return g === 'month' ? MONTHS[Number(String(p.label).slice(5, 7)) - 1] : fmt(p.label); }; }
  // The window a chart covers: the range itself, or the last 14 days when the range is too short to show a trend.
  function windowOf(r) { return r.days >= 7 ? { from: r.from, to: r.to, short: false } : { from: shift(r.to, -13), to: r.to, short: true }; }
  // list: service rows. init(): a fresh total for one slice; add(total, row); value(total): the number to draw.
  function series(list, win, init, add, value, text) {
    var g = granOf(diff(win.from, win.to) + 1), b = buckets(win.from, win.to, g), acc = b.map(init);
    list.forEach(function (r) { var d = r[C.DAY]; if (d >= win.from && d <= win.to) add(acc[b.index(d)], r); });
    return { g: g, points: b.map(function (x, i) { return { label: x.from, value: value(acc[i]), title: bucketTitle(x, g) + ': ' + text(acc[i]) }; }) };
  }
  function acresSeries(list, win) {
    return series(list, win, function () { return { a: 0, c: 0 }; }, function (t, r) { t.a += r[C.ACRES]; t.c++; }, function (t) { return Math.round(t.a * 100) / 100; },
      function (t) { return ac(t.a) + ' acres, ' + t.c + (t.c === 1 ? ' service' : ' services'); });
  }
  function countSeries(list, win) {
    return series(list, win, function () { return { a: 0, c: 0 }; }, function (t, r) { t.a += r[C.ACRES]; t.c++; }, function (t) { return t.c; },
      function (t) { return t.c + (t.c === 1 ? ' service' : ' services') + ', ' + ac(t.a) + ' acres'; });
  }
  function servedSeries(list, win, ok) {
    return series(list, win, function () { return {}; }, function (t, r) { if (ok(r[C.FARMER])) t[r[C.FARMER]] = 1; }, function (t) { return Object.keys(t).length; },
      function (t) { var k = Object.keys(t).length; return k + (k === 1 ? ' farmer served' : ' farmers served'); });
  }
  function registeredSeries(win) {
    var g = granOf(diff(win.from, win.to) + 1), b = buckets(win.from, win.to, g), acc = b.map(function () { return 0; });
    Sync.farmers.raw().forEach(function (f) { var d = f[14]; if (f[8] === 'Active' && d && d >= win.from && d <= win.to) acc[b.index(d)]++; });
    return { g: g, points: b.map(function (x, i) { return { label: x.from, value: acc[i], title: bucketTitle(x, g) + ': ' + acc[i] + ' registered' }; }) };
  }

  // ---------- small pieces ----------
  function tone(x) { return x > 0 ? 'up' : (x < 0 ? 'down' : 'flat'); }
  // "+12% vs the 30 days before" (null when there is nothing to compare with)
  function deltaText(cur, prev, r, short) {
    if (!r.prev || prev === null || prev === undefined) return null;
    if (!prev) return cur ? 'new: none before' : null;
    var d = Math.round((cur - prev) / prev * 100);
    var s = (d > 0 ? '+' : (d < 0 ? '−' : '')) + Math.abs(d) + '%';
    return short ? s + ' vs before' : s + ' vs ' + rangeText(r.prev.from, r.prev.to);
  }
  function deltaChip(cur, prev, r, unit) {
    var t = deltaText(cur, prev, r);
    if (!t) return h('span', { class: 'hmdelta flat', text: r.k === 'all' ? 'All records' : 'Nothing to compare with' });
    var prevText = prev ? ' (' + n(ac(prev)) + (unit ? ' ' + unit : '') + ')' : '';
    return h('span', { class: 'hmdelta ' + tone(cur - prev), text: t + prevText });
  }
  function sortedList(map, valueKey) {
    return Object.keys(map).map(function (k) { return { name: k, c: map[k].c, a: map[k].a }; }).sort(function (x, y) { return y[valueKey] - x[valueKey] || String(x.name).localeCompare(String(y.name)); });
  }
  function divisionOf(farmerId) {
    var f = Sync.farmers.row(farmerId);
    return f ? (f[6] || f[5] || 'Not recorded') : 'Not recorded';
  }
  function groupBy(list, keyOf) {
    var m = {};
    list.forEach(function (r) { var k = keyOf(r), o = m[k] = m[k] || { c: 0, a: 0, f: {}, rs: 0, rn: 0 }; o.c++; o.a += r[C.ACRES]; o.f[r[C.FARMER]] = 1; if (r[C.RATING]) { o.rs += r[C.RATING]; o.rn++; } });
    return m;
  }

  // ---------- the pop-up ----------
  function section(title, note, body) { return h('div', { class: 'hmsec' }, h('h3', { text: title }), note ? h('p', { class: 'cardnote', text: note }) : null, body); }
  function facts(items) {

      var f = [];

      if (picks.division.length) f.push({ type: 'division', values: picks.division.slice() });

  <script>
// A search box in the top bar (on a computer): find a farmer from any screen. It searches the list kept on the device (Sync.html), so
// the answers appear as you type. "/" or Ctrl+K puts the cursor in it; Enter opens the first answer; Esc closes the list.
// A manager or admin opens the profile, a pilot goes straight to recording a service for that farmer.
var TopSearch = (function () {
  var built = false;

  function mount() {
    var holder = document.getElementById('topsearch');
    if (!holder) return;
    clear(holder);
    var role = Session.user && Session.user.role;
    if (role !== 'Admin' && role !== 'Manager' && role !== 'Pilot') return;       // data entry staff cannot look farmers up
    var pilot = role === 'Pilot';
    var input = h('input', { type: 'text', placeholder: 'Search a farmer', autocomplete: 'off', spellcheck: 'false', 'aria-label': 'Search a farmer from anywhere', maxlength: 60 });
    var key = h('kbd', { text: '/' });
    var list = h('div', { class: 'tsres', role: 'listbox' });
    var box = h('div', { class: 'tsbox' }, icon('search'), input, key, list);
    holder.appendChild(box);
    var rows = [], active = -1, timer = null;

    function open(f) {
      input.value = ''; close(); input.blur();
      if (pilot) Nav.open('Record service', { farmer_id: f.farmer_id }); else Nav.openFarmer(f.farmer_id);
    }
    function close() { list.style.display = 'none'; clear(list); rows = []; active = -1; box.classList.remove('open'); }
    function paintActive() { Array.prototype.forEach.call(list.querySelectorAll('.tsrow'), function (el, i) { el.classList.toggle('on', i === active); }); }
    function draw() {
      var q = input.value.trim();
      clear(list); rows = []; active = -1;
      if (q.length < 2) { list.style.display = 'none'; box.classList.remove('open'); return; }
      box.classList.add('open'); list.style.display = 'block';
      if (!Sync.farmers.ready()) { list.appendChild(h('div', { class: 'tsnone', text: 'Getting the farmer list for the first time…' })); return; }
      var found;
      try { found = Sync.farmers.search(q, { limit: 6, activeOnly: pilot }); } catch (e) { return; }
      if (!found.length) { list.appendChild(h('div', { class: 'tsnone', text: 'No farmer found' })); return; }
      rows = found;
      found.forEach(function (f, i) {
        var place = [f.village, f.ds_division].filter(function (x, k, a) { return x && a.indexOf(x) === k; }).join(', ');
        list.appendChild(h('button', { type: 'button', class: 'tsrow', role: 'option', onmousedown: function (e) { e.preventDefault(); }, onclick: function () { open(f); } },
          h('span', { class: 'avatar', text: initials(f.full_name) }),
          h('span', { class: 'tst' }, h('b', { text: f.full_name }), h('small', { text: [f.farmer_id, f.phone_primary, place].filter(Boolean).join(' · ') }))));
      });
      list.appendChild(h('button', { type: 'button', class: 'tsall', onmousedown: function (e) { e.preventDefault(); }, onclick: function () { var v = input.value; input.value = ''; close(); input.blur(); Nav.open('Find farmer', { query: v }); } },
        'See all matches', icon('chevron')));
    }
    input.addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(draw, 80); });
    input.addEventListener('focus', function () { box.classList.add('focus'); draw(); });
    input.addEventListener('blur', function () { box.classList.remove('focus'); setTimeout(close, 120); });
    input.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown') { e.preventDefault(); active = Math.min(rows.length - 1, active + 1); paintActive(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); active = Math.max(0, active - 1); paintActive(); }

    });

      // "/" (or Ctrl+K) from anywhere puts the cursor in the box, unless the person is typing in a field already
      document.addEventListener('keydown', function (e) {

    }
  }
  return { mount: mount };
})();

  <script>
// The farm's GPS point on screen: a small card with the "Update GPS location" button (reads the phone's GPS), a box to paste a place copied from
// Google Maps, and a note that says where the point came from (phone GPS, typed in, or an estimated placeholder that is not the real place).
// Two ways to use it:
//   GpsUI.card({ value, canEdit })                 a form field: the new point is held in the card, form code reads it with card.get() when saving
//   GpsUI.card({ value, canEdit, save: fn(v) })    saves at once: fn gets { latitude, longitude, gps_source, gps_accuracy } and returns a Promise
//   opts.compact: a single row (for the Record service screen)
// GpsUI.parse(text) understands "7.9403, 80.7718", Google Maps links (@lat,lng or !3d..!4d.. or ?q=lat,lng) and 7°56'25"N 80°46'18"E.
var GpsUI = (function () {
  var BOUNDS = { south: 5.6, north: 10.1, west: 79.3, east: 82.1 };       // Sri Lanka with a little sea around it (the server checks the same box)
  var WEAK_M = 100;                                                         // a reading worse than this asks the person before it is used

  function inLanka(la, lo) { return la >= BOUNDS.south && la <= BOUNDS.north && lo >= BOUNDS.west && lo <= BOUNDS.east; }
  function round6(x) { return Math.round(x * 1e6) / 1e6; }
  function mapsUrl(la, lo) { return 'https://www.google.com/maps?q=' + la + ',' + lo; }

  // ---------- reading a place that was typed or pasted ----------
  // Returns { lat, lng } or { error: 'plain words' }.
  function parse(text) {
    var raw = String(text || '').trim();
    if (!raw) return { error: 'Paste or type the place first.' };
    if (/(maps\.app\.goo\.gl|goo\.gl\/maps|g\.co\/kgs)/i.test(raw)) return { error: 'That is a short link and the app cannot open it. Open it in Google Maps, then copy the numbers shown (for example 7.9403, 80.7718), or the long address.' };
    var s = raw;
    try { s = decodeURIComponent(raw.replace(/\+/g, ' ')); } catch (e) { s = raw; }
    var la = null, lo = null, m;
    if ((m = s.match(/@(-?\d{1,3}(?:\.\d+)?),\s*(-?\d{1,3}(?:\.\d+)?)/))) { la = +m[1]; lo = +m[2]; }                                   // a Google Maps address: .../@7.94,80.77,17z
    else if ((m = s.match(/!3d(-?\d{1,3}(?:\.\d+)?)!4d(-?\d{1,3}(?:\.\d+)?)/))) { la = +m[1]; lo = +m[2]; }                              // .../!3d7.94!4d80.77
    else if ((m = s.match(/[?&](?:q|ll|query|destination|center|daddr)=\s*(-?\d{1,3}(?:\.\d+)?)\s*[, ]\s*(-?\d{1,3}(?:\.\d+)?)/))) { la = +m[1]; lo = +m[2]; }   // ...?q=7.94,80.77
    else if ((m = s.match(/(\d{1,3})\s*[°º]\s*(\d{1,2})\s*['′’]\s*(\d{1,2}(?:\.\d+)?)\s*(?:["″”]|'')?\s*([NSns])[\s,;]*(\d{1,3})\s*[°º]\s*(\d{1,2})\s*['′’]\s*(\d{1,2}(?:\.\d+)?)\s*(?:["″”]|'')?\s*([EWew])/))) {
      la = (+m[1] + m[2] / 60 + m[3] / 3600) * (/s/i.test(m[4]) ? -1 : 1); lo = (+m[5] + m[6] / 60 + m[7] / 3600) * (/w/i.test(m[8]) ? -1 : 1);   // 7°56'25.1"N 80°46'18.5"E
    } else if ((m = s.match(/(-?\d{1,3}\.\d+)\s*°?\s*([NSns])?\s*[,;\s]\s*(-?\d{1,3}\.\d+)\s*°?\s*([EWew])?/))) {                                // 7.9403, 80.7718  (or 7.9403 N 80.7718 E)
      la = +m[1] * (/s/i.test(m[2] || '') ? -1 : 1); lo = +m[3] * (/w/i.test(m[4] || '') ? -1 : 1);
    }
    if (la === null || !isFinite(la) || !isFinite(lo)) return { error: 'The app could not find two numbers in that. Write them like this: 7.9403, 80.7718 (latitude first), or paste the Google Maps link.' };
    if (!inLanka(la, lo) && inLanka(lo, la)) { var t = la; la = lo; lo = t; }                                                                // longitude and latitude the wrong way round
    if (!inLanka(la, lo)) return { error: 'That place is outside Sri Lanka. Check the numbers: latitude first (about 6 to 10), then longitude (about 79 to 82).' };
    return { lat: round6(la), lng: round6(lo) };
  }

  // ---------- reading the phone's GPS ----------
  // Watches the position for a few seconds and keeps the best reading, because the first reading is often rough.
  // progress(best) is called as readings come in. Resolves { lat, lng, accuracy } (accuracy in metres).

    var has = v && v.latitude !== '' && v.latitude !== undefined && v.latitude !== null && v.longitude !== '' && v.longitude !== undefined && v.longitude !== null;
    if (!has) return { tone: 'none', text: 'No location yet' };

    if (v.gps_source === 'device') return { tone: 'device', text: 'Phone GPS' + (Number(v.gps_accuracy) ? ' · within ' + Math.round(v.gps_accuracy) + ' m' : '') };

  }

  // ---------- the card ----------

    if (opts.value) { v.latitude = opts.value.latitude === undefined ? '' : opts.value.latitude; v.longitude = opts.value.longitude === undefined ? '' : opts.value.longitude; v.gps_source = opts.value.gps_source || ''; v.gps_accuracy = opts.value.gps_accuracy === undefined ? '' : opts.value.gps_accuracy; }

          message = has(v) ? 'Location saved.' : 'Location removed.'; messageBad = false; reading = null; weak = null; pasteOpen = false; paint();
        }).catch(function (e) { busy = false; message = e.message; messageBad = true; paint(); });
      }
      v = next; message = has(v) ? 'Location set. It is saved when you save the form.' : 'Location removed. It is saved when you save the form.'; messageBad = false; reading = null; weak = null; pasteOpen = false; paint();
      if (opts.onChange) opts.onChange(get());
      return Promise.resolve();
    }
    function update() {
      if (busy || reading) return;
      message = ''; weak = null; reading = { text: 'Finding your position…' }; paint();
      locate(function (best) { reading = { text: 'Finding your position… within ' + best.accuracy + ' m' }; paint(); }).then(function (r) {
        reading = null;
        if (r.accuracy > WEAK_M) { weak = r; paint(); return; }

// The phone / browser BACK button. Without this the whole app is one page, so Back leaves the app. With it, every screen change and every
// open pop-up is one entry in the browser history, and Back steps back through them: first the newest pop-up closes, then the screen before.
//
// Public API (everything else is private):
//   Back.push(closeFn)    a pop-up / panel / full-screen mode has just opened: call this right after showing it. Returns a token.
//                         closeFn(why) must close it. It is called when the person presses Back (why = 'back') or when the app moves to
//                         another screen (why = 'nav'). closeFn may call Back.release itself (that is then ignored).
//   Back.release(token)   the pop-up closed by itself (X button, Esc, click outside, Cancel, "Done"). Call it from the one function that
//                         closes the pop-up; it does NOT call closeFn. It removes the pop-up's history entry so Back stays in step.
//                         Safe to call twice, and with a token that Back already closed.
//   Back.current()        { label, arg } of the screen the history says is shown, or null.
// Nav uses (not for screens): Back.visit(label, arg) for each Nav.open, Back.closeLayers() before a screen change, Back.reset() when the
// signed-in person changes or signs out, and Back.onGo(label, arg, scrollY) which Nav sets to show a screen again after Back.
//
// How it works. The history is [guard, first screen, ...]. Each entry's state is { gl: this page load, idx: number } and the matching row
// (a screen with its argument, or a pop-up) is kept in memory in `rows`, so a farmer profile or "Record service for this farmer" comes back
// with its argument. No address is ever changed (Apps Script would not like it). Pressing Back on the first screen first shows
// "Press back again to exit" and stays; a second press within a few seconds leaves (we are then on the guard entry, the first one, so the
// system does the leaving: an installed app closes, a browser tab returns to the page before). If the browser refuses pushState the
// app works as before, only Back leaves it. Real history changes (pushState / go) are queued and done one at a time, because history.go()
// only completes later; the bookkeeping in `rows` and `pos` is always up to date at once.
var Back = (function () {
  var sid = String(Math.random()).slice(2) + String(new Date().getTime());   // tells entries of this page load from older ones
  var ok = true;            // false once the browser refused to change the history
  var rows = [];            // rows[i] is the entry with idx i: { kind: 'guard' } | { kind: 'screen', label, arg, key, scroll } | { kind: 'layer', close, dead }
  var pos = -1;             // idx of the entry the browser is on (-1: not started on this page load / this sign-in)
  var cur = null;           // the screen row that is shown
  var q = [];               // history operations waiting their turn
  var waiting = null;       // a go() we started and wait for: { idx, timer }
  var armTimer = null;      // the "press back again" window
  var uid = 0;
  var api = { onGo: null };

  function stateOf(idx) { return { gl: sid, idx: idx }; }
  function scrollY() { try { return window.pageYOffset || document.documentElement.scrollTop || 0; } catch (e) { return 0; } }
  function argKey(arg) { try { var s = JSON.stringify(arg); return s === undefined ? '' : s; } catch (e) { return '#' + (++uid); } }

  function pump() {

  // The first use on this page load: the entry we are on becomes the guard (entry 0). If it is an entry left by an earlier page load
  // (the page was reloaded), first walk back to the lowest of those, so no old entries stand between the guard and the exit.
  function start() {

    // (a pop-up that is not the newest keeps its entry; it stands for the screen under it if Back ever lands on it)
  }

  // The app is about to show another screen: close the pop-ups that are open (they sit on top of the history) and drop their entries.
  function closeLayers() {
    if (!ok) return;
    var k = 0;
    while (pos - k > 0 && rows[pos - k] && rows[pos - k].kind === 'layer') k++;
    if (!k) return;

  }

  function reset() {
    clearArm();
    for (var i = rows.length - 1; i >= 0; i--) { var r = rows[i]; if (r && r.kind === 'layer' && !r.dead) { r.dead = true; try { r.close('nav'); } catch (e) { /* ignore */ } } }
    var old = pos;
    rows = []; cur = null; pos = -1;
    if (!ok || old < 0) return;
    rows = [{ kind: 'guard' }]; pos = 0;
    if (old > 0) phys({ t: 'go', n: -old, idx: 0 });
    phys({ t: 'replace', s: stateOf(0) });
  }

  function atRoot() {
    if (!cur) return;                        // nothing is shown (signed out): leave it alone
    showMsg('Press back again to exit', false);
    armTimer = setTimeout(rearm, 2500);
  }
  // Nobody pressed Back a second time: put the first screen's entry back on top of the guard, so the next Back starts the same way again.
  function rearm() {
    armTimer = null;
    if (!ok || pos !== 0 || !cur) return;
    rows.length = 1;
    var row = { kind: 'screen', label: cur.label, arg: cur.arg, key: cur.key, scroll: cur.scroll };
    rows.push(row); pos = 1; cur = row;
    phys({ t: 'push', s: stateOf(1) });
  }

  function onPop(e) {
    var s = e ? e.state : null;
    if (waiting && s && typeof s.idx === 'number' && s.idx === waiting.idx) { clearTimeout(waiting.timer); waiting = null; pump(); return; }   // our own go() arrived
    if (!ok) return;
    if (!s || typeof s !== 'object' || typeof s.idx !== 'number' || s.gl !== sid || !rows[s.idx]) { clearArm(); pos = -1; rows = []; cur = null; return; }   // an entry that is not ours
    var idx = s.idx;
    if (idx === pos) return;
    clearArm();
    if (cur) cur.scroll = scrollY();
    var i;
    for (i = pos; i > idx; i--) { var r = rows[i]; if (r && r.kind === 'layer' && !r.dead) { r.dead = true; try { r.close('back'); } catch (err) { /* ignore */ } } }   // newest pop-up first
    pos = idx;
    if (rows[idx].kind === 'guard') { atRoot(); return; }
    var j = idx;
    while (j > 0 && rows[j].kind === 'layer') j--;                      // a pop-up's entry stands for the screen under it
    var scr = rows[j];
    if (scr.kind === 'screen' && scr !== cur) { cur = scr; if (api.onGo) api.onGo(scr.label, scr.arg, scr.scroll); }
  }

  try { window.addEventListener('popstate', onPop); } catch (e) { ok = false; }

  api.push = pushLayer;
  api.release = release;
  api.visit = visit;
  api.closeLayers = closeLayers;
  api.reset = reset;
  api.current = function () { return cur ? { label: cur.label, arg: cur.arg } : null; };
  api.canBack = function () { return ok && pos > 1 && !!cur; };      // a screen before this one exists in the history
  return api;
})();

// Navigation shared by every screen: Nav.open('Find farmer') or Nav.openFarmer('F000012').
// The main buttons sit in a coloured icon menu (left side on a computer, bottom bar on a phone); the rest are under "More".
var Nav = (function () {
  var main = document.getElementById('main');
  var nav = document.getElementById('nav');
  var sheet = document.getElementById('sheet');
  var sheetGrid = document.getElementById('sheetgrid');
  var screens = {};
  var meta = {};
  var tabs = [];

  // The "More" sheet is a pop-up for the Back button: it opens with its own history entry (Back closes it) and gives the entry up when it closes.
  var sheetTok = null;
  function closeSheet() { var t = sheetTok; sheetTok = null; if (t) Back.release(t); sheet.className = ''; }
  sheet.addEventListener('click', function (e) { if (e.target === sheet) closeSheet(); });
  document.getElementById('logo').addEventListener('click', function () { if (tabs.length) open(tabs[0].label); });

  // a back button for screens that belong to another (a farmer's profile, the tree map): it goes back in the history like the phone's Back button
  var backBtn = document.getElementById('backbtn');
  backBtn.appendChild(icon('chevronleft'));
  backBtn.addEventListener('click', function () {
    var c = Back.current(), m = c && meta[c.label];
    if (Back.canBack()) window.history.back(); else if (m && m.parent) open(m.parent);
  });
  function updateBack(m) {
    var show = !!(m && m.parent) && (Back.canBack() || !!meta[m.parent]);
    backBtn.style.display = show ? 'inline-grid' : 'none';
    if (show) { var p = meta[m.parent] || {}; backBtn.title = 'Back' + (p.title ? ' to ' + p.title : ''); backBtn.setAttribute('aria-label', backBtn.title); }
  }
  function setTitle(title, iconName, color, sub) {
    document.getElementById('pagesub').textContent = sub || '';
    document.getElementById('pagetitle').textContent = title || '';
    var holder = document.getElementById('pageico');
    clear(holder);
    if (iconName && ICONS[iconName]) holder.appendChild(ico(iconName, color || 'green', 'sm'));
    document.title = (title ? title + ' · ' : '') + APP.name;
  }

  function highlight(label) {
    Array.prototype.forEach.call(nav.querySelectorAll('.navbtn'), function (b) {
      b.className = b.className.replace(/\bon\b/g, '').replace(/\s+/g, ' ').trim() + (b.getAttribute('data-label') === label ? ' on' : '');
    });
  }

  // fromBack: the person pressed Back, so the screen is shown again without adding a history entry (scrollY is where they had scrolled).
  function open(label, arg, fromBack, scrollY) {
    hideMsg();
    if (!fromBack) Back.closeLayers();      // pop-ups that are open close first (the sheet below is one of them)
    closeSheet();
    var m = meta[label] || {};
    var lit = m.parent || label;
    var litMeta = meta[lit] || m;
    // a screen reached from "More" lights up the More button
    var inBar = tabs.some(function (t) { return t.label === lit && t.primary; });
    highlight(inBar ? lit : '__more');
    setTitle(m.title || label, m.icon || litMeta.icon, m.color || litMeta.color, m.sub || '');
    // Each screen draws into its own container. A slow screen that finishes loading after the user has
    // moved on draws into a container that is no longer on the page, so it cannot overwrite the current one.
    //
    // Going from one screen to another never shows a blank page: the old screen stays (dimmed, with a thin progress line on top of the page)
    // until the new one has drawn something other than a spinner (or has failed, or after 8 seconds), then the old one fades out on top of
    // it while the new one fades in (opacity only: the map screen has fixed children). The page goes back to the top once, with the new screen.
    if (!fromBack) Back.visit(label, arg);   // one history entry for every screen change
    updateBack(m);
    cancelPending();
    Array.prototype.slice.call(main.children).forEach(function (c) { if (c.classList.contains('scr-out') || c.classList.contains('scr-pend')) main.removeChild(c); });
    var holder = h('div', { class: 'scr' });
    var old = main.firstElementChild;
    var wait = old && motionOK() && !m.instant && old.offsetHeight > 0;
    // a new screen starts at the top; a screen the person comes back to is put back where they had scrolled (as far as its content is already there)
    function settle() { if (fromBack && scrollY > 0) putScroll(scrollY); else scrollInstant(0); }
    if (!wait) {
      reveal(holder, old);
      screens[label](holder, arg);
      settle();
      return;
    }
    holder.className = 'scr scr-pend';
    main.classList.add('xf');
    main.appendChild(holder);
    screens[label](holder, arg);
    var t0 = Date.now(), done = false;
    var dimTimer = setTimeout(function () { old.classList.add('scr-wait'); progress(true); }, 150);
    var mo = new MutationObserver(check);
    mo.observe(holder, { childList: true, subtree: true, characterData: true });
    var iv = setInterval(check, 100);
    function stop() { done = true; clearTimeout(dimTimer); clearInterval(iv); mo.disconnect(); progress(false); old.classList.remove('scr-wait'); pending = null; }
    function check() {
      if (done) return;
      // ready: the screen has drawn something real and its main area is no longer a spinner (a screen that already shows its controls is
      // shown after at most 1.5 s even if its list is still on the way), or it failed (the red message is up), or it takes very long
      var elapsed = Date.now() - t0, content = hasContent(holder);
      if ((content && (!mainSpinner(holder) || elapsed > 1500)) || document.getElementById('msg').className === 'err' || elapsed > 8000) { stop(); reveal(holder, old); settle(); }
    }
    pending = { cancel: function () { stop(); if (holder.parentNode === main) main.removeChild(holder); } };
    check();
  }

  // Puts the page at y, and once more a moment later when the screen was still filling up and was too short to scroll that far (only if the person has not scrolled since).
  function putScroll(y) {
    scrollInstant(y);
    [250, 700].forEach(function (ms) { setTimeout(function () { if (scrollNow() === lastPut && lastPut < y) { scrollInstant(y); lastPut = scrollNow(); } }, ms); });
    lastPut = scrollNow();
  }
  var lastPut = 0;

  var pending = null;
  function cancelPending() { if (pending) { var p = pending; pending = null; p.cancel(); } }

  // Puts `holder` in place of `old`: the old screen stays where it is on the screen, fades out on top and is removed when it has faded.
  function reveal(holder, old) {
    var y = scrollNow();
    if (old && old.parentNode === main) {
      if (motionOK() && old.offsetHeight > 0) {
        old.className = (old.className + ' scr-out').trim();
        old.style.top = (-y) + 'px';            // it stays at the same place on the screen although the page goes back to the top
        old.setAttribute('aria-hidden', 'true');
        main.classList.add('xf');
        var gone = function () { if (old.parentNode === main) main.removeChild(old); if (!main.querySelector(':scope > .scr-out, :scope > .scr-pend')) main.classList.remove('xf'); };
        old.addEventListener('animationend', gone);
        setTimeout(gone, 400);
      } else main.removeChild(old);
    }
    holder.classList.remove('scr-pend');
    holder.classList.add('scr-in');
    if (holder.parentNode !== main) main.appendChild(holder);
    setTimeout(function () { holder.classList.remove('scr-in'); }, 380);
  }

  // true once a screen has drawn something real (text, a field, a picture), not just a spinner or empty boxes
  function hasContent(root) {
    var all = root.getElementsByTagName('*');
    for (var i = 0; i < all.length; i++) {
      var e = all[i];
      if (e.children.length || e.classList.contains('skel') || (e.closest && e.closest('.loading'))) continue;
      var t = e.tagName;
      if (t === 'INPUT' || t === 'SELECT' || t === 'TEXTAREA' || t === 'CANVAS' || t === 'IMG' || e.namespaceURI !== 'http://www.w3.org/1999/xhtml') return true;
      if ((e.textContent || '').replace(/\s+/g, '') !== '') return true;
    }
    return false;
  }
  // true while the main area of a screen is still a spinner (spinners inside a card, a fold, or a box marked data-late are not the main area)
  function mainSpinner(root) {
    var s = root.querySelectorAll('.loading');
    for (var i = 0; i < s.length; i++) if (!s[i].closest('.card, details, [data-late]')) return true;
    return false;
  }
  // a thin line at the very top of the page while the next screen is on its way
  var pbar = h('div', { id: 'pbar', 'aria-hidden': 'true' });
  document.body.appendChild(pbar);
  function progress(on) { pbar.className = on ? 'on' : ''; }

  function navButton(t) {
    return h('button', { type: 'button', class: 'navbtn c-' + (t.color || 'green'), 'data-label': t.label, 'aria-label': t.title || t.label, onclick: function () { open(t.label); } },
      icon(t.icon || 'home'), h('span', { text: t.short || t.label }));
  }
  function moreButton() {
    return h('button', { type: 'button', class: 'navbtn c-slate', 'data-label': '__more', 'aria-label': 'More', onclick: openMore }, icon('more'), h('span', { text: 'More' }));
  }

  function openMore() {
    clear(sheetGrid);
    sheetGrid.appendChild(h('div', { class: 'launch' }, tabs.filter(function (t) { return !t.primary; }).map(function (t) {
      return h('button', { type: 'button', class: 'lt c-' + (t.color || 'green'), onclick: function () { open(t.label); } }, ico(t.icon, t.color || 'green'), h('span', { class: 'ltt' }, h('b', { text: t.short || t.label }), t.sub ? h('small', { text: t.sub }) : null));
    })));
    sheet.className = 'open';
    if (!sheetTok) sheetTok = Back.push(closeSheet);
  }

  // tabs: { label, screen, icon, color, title, short, primary }. extra screens can be opened but have no button of their own.
  function setTabs(list, extra) {
    wipe();
    tabs = list;
    list.forEach(function (t) { screens[t.label] = function (el, arg) { t.screen.mount(el, arg); }; meta[t.label] = t; });
    list.filter(function (t) { return t.primary; }).forEach(function (t) { nav.appendChild(navButton(t)); });
    if (list.some(function (t) { return !t.primary; })) nav.appendChild(moreButton());
    document.body.classList.toggle('single', list.length < 2);
    (extra || []).forEach(function (t) { screens[t.label] = function (el, arg) { t.screen.mount(el, arg); }; meta[t.label] = t; });
  }
  // Adds one more screen after the others were drawn (it goes under "More").
  function addTab(t) {
    t.primary = false;
    screens[t.label] = function (el, arg) { t.screen.mount(el, arg); };
    meta[t.label] = t;
    var hadMore = tabs.some(function (x) { return !x.primary; });
    tabs.push(t);
    if (!hadMore) nav.appendChild(moreButton());
  }
  // Empties the menu and the screen area. The browser history is left alone (the same person may be setting the menu up again).
  function wipe() { cancelPending(); screens = {}; meta = {}; tabs = []; clear(nav); clear(main); setTitle('', ''); closeSheet(); document.body.classList.remove('single'); }
  // Sign-out or another person: the menu is emptied and the history of the old session is thrown away.
  function reset() { Back.reset(); wipe(); }
  // Shows the screen the history says we are on again (a pop-up page such as "Change password" has just been left by Back).
  function reshow(keepScroll) { var c = Back.current(); if (c) open(c.label, c.arg, true, keepScroll ? scrollNow() : 0); }
  Back.onGo = function (label, arg, y) { if (screens[label]) open(label, arg, true, y); };
  // A farmer opens as a profile with the origin route and the log book (admins edit from there). Pilots go straight to the edit form.
  function openFarmer(id) { open(Session.user && Session.user.role === 'Pilot' ? 'Register farmer' : 'View farmer', id); }
  return { open: function (label, arg) { open(label, arg); }, reshow: reshow, setTabs: setTabs, addTab: addTab, reset: reset, openFarmer: openFarmer, setTitle: setTitle, tabs: function () { return tabs; } };
})();

// Which screens each role gets. The server enforces the same rules; this only decides what to show.
function startApp() {
  var role = Session.user.role;
  var can = { enter: role === 'Admin' || role === 'DataEntry' || role === 'Pilot', look: role === 'Admin' || role === 'Manager', admin: role === 'Admin', serve: role === 'Admin' || role === 'Manager' || role === 'Pilot' };
  var tabs = [];
  if (role !== 'DataEntry') tabs.push({ label: 'Home', screen: Home, icon: 'home', color: 'green', title: 'Home', short: 'Home', sub: '', primary: true });
  if (can.enter) tabs.push({ label: 'Register farmer', screen: Register, icon: 'userplus', color: 'green', title: 'New farmer', short: role === 'Pilot' ? 'New' : 'Register', sub: 'Add a farmer in five short steps', primary: role !== 'Admin' });
  if (can.look || role === 'Pilot') tabs.push({ label: 'Find farmer', screen: Find, icon: 'search', color: 'green', title: 'Find a farmer', short: 'Find', sub: 'Search by name, phone, village or ID', primary: true });
  if (can.serve) tabs.push({ label: 'Record service', screen: ServiceEntry, icon: 'drone', color: 'sky', title: 'Record a service', short: 'Service', sub: 'Log a spraying job in under a minute', primary: true });
  if (can.serve && role !== 'Pilot') tabs.push({ label: 'Service log', screen: ServiceList, icon: 'list', color: 'sky', title: 'Service log', short: 'Log', sub: 'Every job, with filters and export', primary: false });
  if (can.look) tabs.push({ label: 'Service report', screen: ServiceReport, icon: 'chart', color: 'sun', title: 'Reports', short: 'Report', sub: 'Figures by time, place, pilot and crop', primary: true });
  if (can.look) tabs.push({ label: 'Messages', screen: Messages, icon: 'megaphone', color: 'violet', title: 'Send a message', short: 'Message', sub: 'Write to a group of farmers', primary: false });
  if (can.look) tabs.push({ label: 'Earth', screen: Earth, icon: 'globe', color: 'aqua', title: 'Earth', short: 'Map', sub: 'Farmers and spraying on the map', primary: true, instant: true });
  if (can.look) tabs.push({ label: 'Export data', screen: DataExport, icon: 'download', color: 'slate', title: 'Export', short: 'Export', sub: 'Download your data', primary: false });
  if (can.admin) {
    tabs.push({ label: 'Form Designer', screen: Designer, icon: 'sliders', color: 'slate', title: 'Form designer', short: 'Form', sub: 'The questions asked when registering', primary: false });
    tabs.push({ label: 'Form Preview', screen: Preview, icon: 'eye', color: 'slate', title: 'Form preview', short: 'Preview', sub: 'See the form as staff see it', primary: false });
    tabs.push({ label: 'Service setup', screen: ServiceSetup, icon: 'settings', color: 'slate', title: 'Service setup', short: 'Setup', sub: 'Kinds of service and drones', primary: false });
    tabs.push({ label: 'Accounts', screen: Accounts, icon: 'users', color: 'slate', title: 'People', short: 'People', sub: 'Accounts and who can do what', primary: false });
  }
  Nav.setTabs(tabs, [{ label: 'View farmer', screen: ViewFarmer, icon: 'user', color: 'green', title: 'Farmer', sub: 'Profile, route and log book', parent: 'Find farmer' }, { label: 'Origin Map', screen: OriginMap, icon: 'network', color: 'aqua', title: 'Tree map', sub: 'How farmers reach each origin', parent: 'Earth' }]);
  // The copy of the data kept on this device is opened first (a fraction of a second), so the first screen can draw from it at once.
  var opened = false;
  function first() { if (opened) return; opened = true; Nav.open(tabs[0].label); }
  Sync.start().then(first, first);
  setTimeout(first, 400);
  TopSearch.mount();        // the search box in the top bar (computers)
  if (Session.user.tools) loadExtras();
}
// "Refresh now" in the top bar: the screen that is shown is drawn again from fresh data (the page stays where it is).
Sync.on('refreshed', function () { Nav.reshow(true); });

// Extra screens that only some accounts receive are fetched after sign-in instead of being part of the page.
function loadExtras() {
  call('getExtraScreen').then(function (x) {
    var body = String(x.script).replace(/^[\s\S]*?<script>/, '').replace(/<\/script>[\s\S]*$/, '');
    var el = document.createElement('script');
    el.textContent = body + '\nwindow.__extra = ' + x.global + ';';
    document.body.appendChild(el);
    Nav.addTab(Object.assign({}, x.tab, { screen: window.__extra, icon: 'code', color: 'slate', short: 'Dev' }));
  }).catch(function () { /* the extra screen is optional */ });
}

Auth.start();
</script>
